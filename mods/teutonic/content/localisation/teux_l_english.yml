 teux_renew_northern_missions_title:0 "Renew the Northern Mission"
 teux_renew_northern_missions_desc:0 "After Siberian Gate, if both settlement grants have expired before An Eastern Coast is completed, spend 300 ducats and 25 papal influence to renew one colonist and +15 yearly settlers for 20 years. This service never stacks with either northern grant."
 teux_choose_title_title:0 "Choose a Ceremonial Title"
 teux_choose_title_desc:0 "After Jerusalem Restored or A World of Chapters, select an earned name for the country. Cosmetic only; free and reversible."
 teux_choose_livery_title:0 "Choose the Chapter Colours"
 teux_choose_livery_desc:0 "After the vanilla Holy Horde mission, choose a map colour. Cosmetic only; free and reversible."
 teux_refresh_tree_title:0 "Refresh the Extended Crusader Missions"
 teux_refresh_tree_desc:0 "Load the installed vanilla-plus-extension mission layout into an existing Teutonic save, including Jerusalem formed after choosing the Crusader path. If migrating from the retired 150-mission overhaul, this removes its old reward modifiers but preserves territory, claims and other campaign state; use a new campaign for a clean vanilla balance baseline. No new missions are completed by this decision."
