l_english:
 teux_i01_title:0 "Muster Houses"
 teux_i01_desc:0 "Historical root: Fortresses, stores, stables and workshops. Fictional continuation: Provision recruitment before the steppe reforms without delaying vanilla access. Source: https://zamek.malbork.pl/en/museum/history-of-the-museum/"
 teux_i02_title:0 "Envoys of the Orders"
 teux_i02_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: Develop the diplomatic solution to the Livonian relationship into a wider network. Source: https://deutscher-orden.com/geschichte/"
 teux_i03_title:0 "Northern Provisioners"
 teux_i03_desc:0 "Historical root: Fortresses, stores, stables and workshops. Fictional continuation: Use the newly claimed Russian foothold to fund supplies for the next campaign. Source: https://zamek.malbork.pl/en/museum/history-of-the-museum/"
 teux_i04_title:0 "Frontier Legates"
 teux_i04_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: Support the vanilla conversion target with cheaper administration, not another permanent missionary-strength stack. Source: https://deutscher-orden.com/geschichte/"
 teux_i05_title:0 "Ruthenian Surveys"
 teux_i05_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: Consolidate the first settlements before the vanilla requirement expands to 25 converted provinces. Source: https://deutscher-orden.com/geschichte/"
 teux_i06_title:0 "School of Captains"
 teux_i06_desc:0 "Historical root: Fortresses, stores, stables and workshops. Fictional continuation: Turn professional experience into an affordable command staff. Source: https://zamek.malbork.pl/en/museum/history-of-the-museum/"
 teux_i07_title:0 "Passes and Stores"
 teux_i07_desc:0 "Historical root: Fortresses, stores, stables and workshops. Fictional continuation: Prepare the existing Crimean frontier to support the Caucasus forts. Source: https://zamek.malbork.pl/en/museum/history-of-the-museum/"
 teux_i08_title:0 "Chapter Schools"
 teux_i08_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: A late internal side step beside cathedral construction, later feeding the learned-clergy continuation. Source: https://deutscher-orden.com/geschichte/"
 teux_n01_title:0 "Russian Chapters"
 teux_n01_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: Preserve the vanilla allied solution to Russia, then open a northern frontier. Source: https://deutscher-orden.com/geschichte/"
 teux_n02_title:0 "Siberian Gate"
 teux_n02_desc:0 "Historical root: Crusading expansion and cavalry adaptation. Fictional continuation: A foothold earns the means to settle beyond the inhabited frontier. Source: https://forum.paradoxplaza.com/forum/developer-diary/europa-universalis-iv-development-diary-3rd-of-may-2022.1523186/"
 teux_n03_title:0 "Winter Commanderies"
 teux_n03_desc:0 "Historical root: Fortresses, stores, stables and workshops. Fictional continuation: The frontier advances only after its supply forts exist. The local discount is applied to eligible northern forts. Source: https://zamek.malbork.pl/en/museum/history-of-the-museum/"
 teux_n04_title:0 "Northern Missions"
 teux_n04_desc:0 "Historical root: Hospital origins and pilgrim protection. Fictional continuation: Expansion and parish infrastructure improve the same settlement service instead of adding a second colonist. Source: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag"
 teux_n05_title:0 "An Eastern Coast"
 teux_n05_desc:0 "Historical root: Crusading expansion and cavalry adaptation. Fictional continuation: Arrival at the Pacific changes the logistical problem and points toward inhabited Manchuria. Source: https://forum.paradoxplaza.com/forum/developer-diary/europa-universalis-iv-development-diary-3rd-of-may-2022.1523186/"
 teux_n06_title:0 "Amur Commanderies"
 teux_n06_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: Settle the Amur frontier before meeting the Chinese branch along its northern approaches. Source: https://deutscher-orden.com/geschichte/"
 teux_n07_title:0 "The Northern Rule"
 teux_n07_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: A distant territorial system earns a modest permanent administrative allowance after consolidation. Source: https://deutscher-orden.com/geschichte/"
 teux_n08_title:0 "A Northern See"
 teux_n08_desc:0 "Historical root: Hospital origins and pilgrim protection. Fictional continuation: End the northern arm with a lasting local institution rather than another empire-wide combat boost. Source: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag"
 teux_e01_title:0 "Beyond the Oxus"
 teux_e01_desc:0 "Historical root: Crusading expansion and cavalry adaptation. Fictional continuation: Begin after the vanilla Holy Horde with a recover-and-plan task that grants the next claims. Source: https://forum.paradoxplaza.com/forum/developer-diary/europa-universalis-iv-development-diary-3rd-of-may-2022.1523186/"
 teux_e02_title:0 "The Khorasan Road"
 teux_e02_desc:0 "Historical root: Crusading expansion and cavalry adaptation. Fictional continuation: Conversion secures the corridor and replenishes the army before Persia. Source: https://forum.paradoxplaza.com/forum/developer-diary/europa-universalis-iv-development-diary-3rd-of-may-2022.1523186/"
 teux_e03_title:0 "The Herat Chapter"
 teux_e03_desc:0 "Historical root: Hospital origins and pilgrim protection. Fictional continuation: An optional city institution rewards rebuilding between large campaigns. Source: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag"
 teux_e04_title:0 "Persian Commanderies"
 teux_e04_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: A court-versus-visitation choice makes conquest produce an administrative question. Source: https://deutscher-orden.com/geschichte/"
 teux_e05_title:0 "The Indus Gate"
 teux_e05_desc:0 "Historical root: Fortresses, stores, stables and workshops. Fictional continuation: Secure a defendable Indus approach before issuing claims toward Delhi. Source: https://zamek.malbork.pl/en/museum/history-of-the-museum/"
 teux_e06_title:0 "A Chapter at Delhi"
 teux_e06_desc:0 "Historical root: Hospital origins and pilgrim protection. Fictional continuation: A major city is an event milestone; the next claims still lead eastward. Source: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag"
 teux_e07_title:0 "The Ganges Road"
 teux_e07_desc:0 "Historical root: Crusading expansion and cavalry adaptation. Fictional continuation: Converted trade settlements finance the southern campaign. Source: https://forum.paradoxplaza.com/forum/developer-diary/europa-universalis-iv-development-diary-3rd-of-may-2022.1523186/"
 teux_e08_title:0 "Monsoon Stores"
 teux_e08_desc:0 "Historical root: Fortresses, stores, stables and workshops. Fictional continuation: A naval logistics side branch supports the later Indian Ocean objective. Source: https://zamek.malbork.pl/en/museum/history-of-the-museum/"
 teux_e09_title:0 "Deccan Commanderies"
 teux_e09_desc:0 "Historical root: Crusading expansion and cavalry adaptation. Fictional continuation: Southern consolidation gives resources and the final Indian coastal claims. Source: https://forum.paradoxplaza.com/forum/developer-diary/europa-universalis-iv-development-diary-3rd-of-may-2022.1523186/"
 teux_e10_title:0 "An Oceanic Order"
 teux_e10_desc:0 "Historical root: Fortresses, stores, stables and workshops. Fictional continuation: The horse-based state must build a real maritime system to connect its overseas-facing possessions. Source: https://zamek.malbork.pl/en/museum/history-of-the-museum/"
 teux_e11_title:0 "Beyond the Ports"
 teux_e11_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: Industrial and commercial investment gives the coastal system a productive hinterland. Source: https://deutscher-orden.com/geschichte/"
 teux_e12_title:0 "A Second Centre"
 teux_e12_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: A mature eastern realm earns one lasting administrative identity, not a bundle of every bonus. Source: https://deutscher-orden.com/geschichte/"
 teux_m01_title:0 "Remount Commissions"
 teux_m01_desc:0 "Historical root: Fortresses, stores, stables and workshops. Fictional continuation: The Holy Horde’s first new military task is a supply commitment, opening Mongolia rather than granting free combat supremacy. Source: https://zamek.malbork.pl/en/museum/history-of-the-museum/"
 teux_m02_title:0 "Break the Ordu"
 teux_m02_desc:0 "Historical root: Crusading expansion and cavalry adaptation. Fictional continuation: Use a limited eastern bridgehead and effective command to earn claims on the wider steppe. Source: https://forum.paradoxplaza.com/forum/developer-diary/europa-universalis-iv-development-diary-3rd-of-may-2022.1523186/"
 teux_m03_title:0 "The Steppe Council"
 teux_m03_desc:0 "Historical root: Crusading expansion and cavalry adaptation. Fictional continuation: Two temporary doctrines answer the same military problem differently. Source: https://forum.paradoxplaza.com/forum/developer-diary/europa-universalis-iv-development-diary-3rd-of-may-2022.1523186/"
 teux_m04_title:0 "The Wall Road"
 teux_m04_desc:0 "Historical root: Fortresses, stores, stables and workshops. Fictional continuation: China requires siege infrastructure and artillery as well as cavalry. Source: https://zamek.malbork.pl/en/museum/history-of-the-museum/"
 teux_m05_title:0 "Northern Capitals"
 teux_m05_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: The city event changes its lasting role without giving a universal army bonus. Source: https://deutscher-orden.com/geschichte/"
 teux_m06_title:0 "River Commanderies"
 teux_m06_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: Productive settlement in the north justifies the next southern commission. Source: https://deutscher-orden.com/geschichte/"
 teux_m07_title:0 "A Southern Chapter"
 teux_m07_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: The inland campaign becomes an institutional network before it can certify a new military doctrine. Source: https://deutscher-orden.com/geschichte/"
 teux_m08_title:0 "The Eastern Marshal"
 teux_m08_desc:0 "Historical root: Crusading expansion and cavalry adaptation. Fictional continuation: Upgrade the vanilla replacement ladder once: either +5 percentage points cavalry ability, +5% artillery ability, or -10% land attrition beyond stage IV. Source: https://forum.paradoxplaza.com/forum/developer-diary/europa-universalis-iv-development-diary-3rd-of-may-2022.1523186/"
 teux_s01_title:0 "Southern Mandate"
 teux_s01_desc:0 "Historical root: Crusading expansion and cavalry adaptation. Fictional continuation: A fresh mandate follows the vanilla Ottoman victory and opens a new territorial objective even if the Ottoman tag is gone. Source: https://forum.paradoxplaza.com/forum/developer-diary/europa-universalis-iv-development-diary-3rd-of-may-2022.1523186/"
 teux_s02_title:0 "Anatolian Marches"
 teux_s02_desc:0 "Historical root: Hospital origins and pilgrim protection. Fictional continuation: Anatolian consolidation supplies the bridge to the Order’s historical Holy Land identity. Source: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag"
 teux_s03_title:0 "The Road to Acre"
 teux_s03_desc:0 "Historical root: Hospital origins and pilgrim protection. Fictional continuation: Use a coastal logistical foothold, not an unexplained teleport to Jerusalem. Source: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag"
 teux_s04_title:0 "Jerusalem Restored"
 teux_s04_desc:0 "Historical root: Hospital origins and pilgrim protection. Fictional continuation: Jerusalem becomes the start of a new southern responsibility and unlocks optional country-title cosmetics. Source: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag"
 teux_s05_title:0 "Pilgrim Roads"
 teux_s05_desc:0 "Historical root: Hospital origins and pilgrim protection. Fictional continuation: Secure and administer the routes before commissioning a Nile campaign. Source: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag"
 teux_s06_title:0 "The Nile Gate"
 teux_s06_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: A limited Egyptian victory unlocks the wider region and a skilled officer to organize its revenues. Source: https://deutscher-orden.com/geschichte/"
 teux_s07_title:0 "Nile Hospitals"
 teux_s07_desc:0 "Historical root: Hospital origins and pilgrim protection. Fictional continuation: Hospital foundations require an economic base rather than merely conquered land. Source: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag"
 teux_s08_title:0 "Red Sea Watch"
 teux_s08_desc:0 "Historical root: Fortresses, stores, stables and workshops. Fictional continuation: The next commission follows actual naval investment, keeping the southern campaign distinct from cavalry warfare. Source: https://zamek.malbork.pl/en/museum/history-of-the-museum/"
 teux_s09_title:0 "Arabian Concord"
 teux_s09_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: A mixed frontier settlement precedes broader claims; this is a speculative continuation, not an asserted historical Arabian conquest plan. Source: https://deutscher-orden.com/geschichte/"
 teux_s10_title:0 "Two Seas"
 teux_s10_desc:0 "Historical root: Fortresses, stores, stables and workshops. Fictional continuation: A mature southern realm must connect and protect its two coastal networks. Source: https://zamek.malbork.pl/en/museum/history-of-the-museum/"
 teux_s11_title:0 "House of Saint Mary"
 teux_s11_desc:0 "Historical root: Hospital origins and pilgrim protection. Fictional continuation: Return the Order’s hospital identity to institutional form long after the city’s capture. Source: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag"
 teux_s12_title:0 "Hospitaller Charter"
 teux_s12_desc:0 "Historical root: Hospital origins and pilgrim protection. Fictional continuation: A hard consolidation ending awards one modest permanent identity and can feed the wider Order’s final chapter. Source: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag"
 teux_c01_title:0 "The General Chapter"
 teux_c01_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: The completed cathedral/conversion branches lead to a political event rather than a compulsory new war. Source: https://deutscher-orden.com/geschichte/"
 teux_c02_title:0 "A Common Treasury"
 teux_c02_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: Spend a manageable part of a proven surplus to lower the cost of governing the enlarged realm. Source: https://deutscher-orden.com/geschichte/"
 teux_c03_title:0 "Visitors of the Order"
 teux_c03_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: Peaceful administration and the condition of provinces become the objective. Source: https://deutscher-orden.com/geschichte/"
 teux_c04_title:0 "A Learned Clergy"
 teux_c04_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: The intermediate schools now support an institutional continuation beyond the vanilla cathedral ending. Source: https://deutscher-orden.com/geschichte/"
 teux_c05_title:0 "The Rule Reaffirmed"
 teux_c05_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: A demanding but optional European ending develops religious institutions without blocking Asia or Jerusalem. Source: https://deutscher-orden.com/geschichte/"
 teux_c06_title:0 "The Order’s Arsenals"
 teux_c06_desc:0 "Historical root: Fortresses, stores, stables and workshops. Fictional continuation: Fortification expertise and fiscal capacity support a temporary siege-logistics improvement. Source: https://zamek.malbork.pl/en/museum/history-of-the-museum/"
 teux_c07_title:0 "A World of Chapters"
 teux_c07_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: Converge only two chosen theatres. The player does not have to conquer every frontier to build a coherent Order. Source: https://deutscher-orden.com/geschichte/"
 teux_c08_title:0 "The Last General Chapter"
 teux_c08_desc:0 "Historical root: Commanderies and central administration. Fictional continuation: The final administrative ending remains available through several campaign combinations. Source: https://deutscher-orden.com/geschichte/"
