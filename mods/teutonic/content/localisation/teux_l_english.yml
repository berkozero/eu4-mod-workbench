 teux.1.t:0 "The Russian Chapter Council"
 teux.1.d:0 "The Schism proclamation leaves a choice between direct administration and a network of cooperating chapters. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.1.a:0 "Commission local chapters"
 teux.1.b:0 "Standardize the liturgy"
 teux.2.t:0 "The Eastern Commission"
 teux.2.d:0 "The Holy Horde now needs a plan for the next frontier. The chapter can reserve men for settlement or spend its treasury on campaign magazines. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.2.a:0 "Reserve men for the settlements"
 teux.2.b:0 "Fund the expedition stores"
 teux.3.t:0 "The Persian Settlement"
 teux.3.d:0 "Converted towns still need workable civil government. The chapter must decide how much authority to leave in local hands. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.3.a:0 "Confirm the local courts"
 teux.3.b:0 "Entrust the visiting clergy"
 teux.4.t:0 "The Delhi Chapter"
 teux.4.d:0 "The captured capital can fund the Order, or its resources can be redirected to a charitable foundation. Either policy must pay for itself. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.4.a:0 "Reopen the city workshops"
 teux.4.b:0 "Endow a hospital and chapel"
 teux.5.t:0 "A Second Centre of the Order"
 teux.5.d:0 "Distance demands a permanent division of responsibilities. The eastern chapter may receive civil authority, or remain chiefly a diplomatic and religious institution. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.5.a:0 "Give it civil jurisdiction"
 teux.5.b:0 "Give it an external mission"
 teux.6.t:0 "The Steppe Council"
 teux.6.d:0 "The frontier captains know the value of local horsemen, but the quartermasters warn that their mounts cannot live on reputation alone. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.6.a:0 "Bind the horsemen by oath"
 teux.6.b:0 "Give the quartermasters priority"
 teux.7.t:0 "The Northern Capital"
 teux.7.d:0 "A great city can be treated as a border fortress or as the administrative centre of a new chapter. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.7.a:0 "Make it a frontier citadel"
 teux.7.b:0 "Reopen the civil offices"
 teux.8.t:0 "The Eastern Marshal"
 teux.8.d:0 "The Order has learned from campaigns on both the steppe and in great settled cities. Its final doctrine must choose a priority rather than pretending every arm can be supreme. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.8.a:0 "Retain the Mounted Core"
 teux.8.b:0 "Integrate the Siege Train"
 teux.8.c:0 "Make Logistics Doctrine"
 teux.9.t:0 "A House near Acre"
 teux.9.d:0 "Returning to the coast revives the hospital tradition. The chapter must choose between paying for a new foundation and first restoring the exhausted port. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.9.a:0 "Restore the harbour first"
 teux.9.b:0 "Endow the hospital"
 teux.10.t:0 "The Jerusalem Charter"
 teux.10.d:0 "Taking the city does not settle the purpose of the restored house. Its first charter must choose how to use the Order’s limited resources. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.10.a:0 "A charter for the pilgrims"
 teux.10.b:0 "A charter for the hospitals"
 teux.11.t:0 "The Arabian Concord"
 teux.11.d:0 "Holding a frontier is not the same as governing it. The chapter can seek agreements through envoys or maintain a heavier system of fortified administration. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.11.a:0 "Send the chapter envoys"
 teux.11.b:0 "Finance fortified administration"
 teux.12.t:0 "The Hospitaller Charter"
 teux.12.d:0 "The southern chapters can now support a lasting common institution. Its endowment must have one primary purpose. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.12.a:0 "Endow pastoral houses"
 teux.12.b:0 "Endow the field hospitals"
 teux.12.c:0 "Endow the port foundations"
 teux.13.t:0 "Priests and Knights"
 teux.13.d:0 "A General Chapter must reconcile clerical service with military administration. Neither can claim unlimited resources. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.13.a:0 "Give the administrators the floor"
 teux.13.b:0 "Reaffirm the clerical houses"
 teux.14.t:0 "The Visitation Report"
 teux.14.d:0 "Visiting brothers find a workable realm, but recommend either clearer delegation or closer inspection from the centre. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.14.a:0 "Confirm delegated authority"
 teux.14.b:0 "Regularize central inspection"
 teux.15.t:0 "The Rule Reaffirmed"
 teux.15.d:0 "With the continental religious struggle settled, the Order can emphasize its clerical vocation or its role as a mediator between Catholic powers. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.15.a:0 "A stronger clerical vocation"
 teux.15.b:0 "A duty to mediate"
 teux.16.t:0 "The Last General Chapter"
 teux.16.d:0 "After two great regional projects, the Order must decide what binds the entire realm together. Its final charter records a chosen purpose rather than demanding every possible conquest. This is a fictional continuation of the vanilla Crusader campaign, not a documented historical plan."
 teux.16.a:0 "The rule of the chapter courts"
 teux.16.b:0 "The duty of mutual defence"
 teux.16.c:0 "The fellowship of the houses"
