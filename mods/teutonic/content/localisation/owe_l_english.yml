 OWE_DOMINION_ADJ:0 "Teutonic"
 owe_event_621_t:0 "A Name Before the World"
 owe_event_621_d:0 "The historical name referred to the German House of Saint Mary in Jerusalem. New territorial titles are counterfactual chapter honors, not historical proclamations. Choose only among honors already earned. This changes the public country name and adjective without forming a new tag. Source: https://deutscher-orden.com/geschichte/"
 owe_event_621_0:0 "Order of Saint Mary."
 owe_event_621_1:0 "Teutonic Ordensstaat."
 owe_event_621_2:0 "Teutonic Commonwealth."
 owe_event_621_3:0 "Teutonic Dominion."
 owe_event_621_4:0 "Restore this country's original name."
 owe_event_621_5:0 "Keep the present title."
 owe_choose_livery_title:0 "Choose the Order's Map Livery"
 owe_choose_livery_desc:0 "After D34, choose an optional map colour. Charcoal and gold unlock after E34; burgundy after F34. No statistics, flags, unit models or music change. Free, repeatable and reversible. The white cloak and black cross are historical; the additional palettes are fictional presentation choices. Source: https://deutscher-orden.com/geschichte/"
 owe_event_622_t:0 "The Mantle and the Map"
 owe_event_622_d:0 "Ivory and charcoal recall the white mantle and black cross. Gold and burgundy are invented late-campaign liveries. This changes only the political map colour; it does not replace the country flag or grant a bonus. Source: https://deutscher-orden.com/geschichte/"
 owe_event_622_0:0 "Ivory mantle."
 owe_event_622_1:0 "Iron charcoal."
 owe_event_622_2:0 "Chapter gold."
 owe_event_622_3:0 "Sovereign burgundy."
 owe_event_622_4:0 "Restore this country's original map colour."
 owe_event_622_5:0 "Keep the present livery."
 owe_policy_02_title:0 "Audit a Commandery"
 owe_policy_02_desc:0 "Historical visitations inspected the Order's houses. Spend 25 ADM and 30 ducats to certify the opening accounts. This does not manufacture income."
 owe_policy_04_title:0 "Settle the Amber Monopoly"
 owe_policy_04_desc:0 "Prussian amber was supervised through officers including the Bernsteinmeister. Choose a modest revenue mix, not unlimited wealth."
 owe_policy_05_title:0 "Call the General Chapter"
 owe_policy_05_desc:0 "The chapter is historically grounded; this vote on the next frontier is fictional."
 owe_policy_06_title:0 "Offer the Livonian Constitution"
 owe_policy_06_desc:0 "Acceptance adds 10 mutual trust and allows the Baltic Compact with two allies; refusal permits another attempt after two years. Cost reduced to 50 DIP. Historical root: the Order's chapters, military service and charitable houses; the proposed continuation is fictional."
 owe_policy_07_title:0 "Re-establish the Livonian Chapter"
 owe_policy_07_desc:0 "When Livonia no longer exists, endow its Livland seat (province 37) for 80 ducats and 20 ADM. This supplies the missing chapter representation for Three Chapters; it does not resurrect a country."
 owe_policy_08_title:0 "Recognize the Lithuanian Settlement"
 owe_policy_08_desc:0 "Lithuania's conversion undermined older crusading pretexts. Recognize Christian Lithuania and abandon claims in Samogitia; this renounces Samogitia alone, leaving the other frontiers available."
 owe_policy_09_title:0 "Accept a Frontier Commission"
 owe_policy_09_desc:0 "The failed Danube service under Klaus von Redwitz in the 1420s-1430s demonstrated the danger of unfunded frontier obligations."
 owe_policy_10_title:0 "Subsidize the Fortress Line"
 owe_policy_10_desc:0 "Fund the defensive line rather than receiving free castles."
 owe_policy_11_title:0 "Appoint a Landmeister"
 owe_policy_11_desc:0 "Requires three eligible Danube/Ruthenian provinces and builds all three there for the same aggregate cost as three ordinary commanderies. Supports C43. Historical root: the Order's chapters, military service and charitable houses; the proposed continuation is fictional."
 owe_policy_12_title:0 "Launch a Relief Mission"
 owe_policy_12_desc:0 "Requires devastation; spends 80 ducats and 1,000 manpower to relieve up to five distinct damaged provinces. Each also gets two years of -1 local unrest. Opens C53. Historical root: the Order's chapters, military service and charitable houses; the proposed continuation is fictional."
 owe_policy_13_title:0 "Charter a Mediterranean Station"
 owe_policy_13_desc:0 "The registered station receives ten years of +10% local trade power, in addition to its commandery and the Acre-route certification. Historical root: the Order's chapters, military service and charitable houses; the proposed continuation is fictional."
 owe_policy_14_title:0 "Restore the Hospital at Acre"
 owe_policy_14_desc:0 "Endow the mother hospital at Acre/Sidon for 100 ducats and 25 ADM. Its -1 local unrest and hospital status are permanent; this named institution counts toward D13 and later Levantine hospital missions. Historical root: the Order began at Acre in 1190. This restoration is fictional."
 owe_policy_16_title:0 "Reform the Rule"
 owe_policy_16_desc:0 "The secularization of Prussia in 1525 shows the historical institutional danger. An enduring reformed Order is the invented alternative."
 owe_policy_17_title:0 "Issue a Protector's Guarantee"
 owe_policy_17_desc:0 "A consenting ally gains 10 mutual trust; the compact enables C24 with two allies. Refusal can be retried after two years. Historical root: the Order's chapters, military service and charitable houses; the proposed continuation is fictional."
 owe_policy_18_title:0 "Summon an Arbitration"
 owe_policy_18_desc:0 "The Order's historical legal claims inspire this fictional congress. An allied ruler may recognize or refuse its arbitration; no province transfers occur."
 owe_policy_19_title:0 "Resolve the Papal Question"
 owe_policy_19_desc:0 "Papal privileges were part of the historical Order's authority. A concordat preserves that relationship. Coercion instead damages the claim to legitimate protection."
 owe_policy_20_title:0 "Ratify the Great Constitution"
 owe_policy_20_desc:0 "The chapters provide the historical institutional root. Neither a global federation nor universal monarchy was the historical Order's program."
 owe_policy_22_title:0 "Convene the World Chapter"
 owe_policy_22_desc:0 "A worldwide chapter is fictional, extending the historical system of representatives from regional houses."
 owe_policy_23_title:0 "Proclaim a Frontier Mandate"
 owe_policy_23_desc:0 "A late-game service commission continues after the mission tree. It grants one ten-year defensive contract, not worldwide claims."
 owe_policy_24_title:0 "Record Universal Temporal Dominion"
 owe_policy_24_desc:0 "A ceremonial epilogue after the finale and the removal of every other independent state. Awards 5 prestige and records the ending. It intentionally unlocks no extra conquest or combat bonus; skip it if you do not want this ending."
 owe_policy_25_title:0 "Choose the Next Charge"
 owe_policy_25_desc:0 "Jerusalem fulfills the old geographical ambition, but this fictional Order refuses to stop. Choose a primary agenda grounded in a different strand of its past: Levantine service, eastern frontier warfare, or European corporate politics."
 owe_policy_26_title:0 "Restore Montfort / Starkenberg"
 owe_policy_26_desc:0 "Montfort was an important Teutonic castle in Galilee, lost to Baybars in 1271. Its reconstruction is represented within Sidon (1855). No fort building is created for free."
 owe_policy_27_title:0 "Territorial Commissions: How They Work"
 owe_policy_27_desc:0 "Frontier missions automatically grant permanent claims on their next target. If every target was allied, owned or undiscovered, a free Issue Pending Claims decision becomes available once an eligible target exists. Recognition renounces Samogitia only. Overseas commissions cover one discovered, colonized coastal province."
 owe_policy_28_title:0 "Authorize a European Theater"
 owe_policy_28_desc:0 "For an eastern or Levantine primary agenda: spend 150 ducats and 75 DIP to authorize European claims. Already completed E11/E12 issue their eligible Silesian/Franconian claims immediately; unfinished missions issue them when completed. The European primary agenda already has this authorization."
 owe_a12_title:0 "Pay the Men"
 owe_a12_desc:0 "Pay the Men\n\nHistorical root: War costs and taxation contributed to conflict with Prussian towns and nobles. The Confederation and its rebellion in 1454 reveal the limits of rule sustained only by military authority.\nWhy this mission (historical problem; fictional resolution): Make pay arrears the first test of government. A victorious army that cannot be paid becomes another threat to the treasury.\nSource: Prussian crisis [S04]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Use the opening army budget to clear expensive borrowing. Maintain regular pay with fewer than two loans and a positive balance. Cheaper reinforcement helps rebuild before the commander's dilemma.\n\nSource: https://academic.oup.com/book/32707/chapter-abstract/271969969\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a44_title:0 "A Treasury That Lasts"
 owe_a44_desc:0 "A Treasury That Lasts\n\nHistorical root: War costs and taxation contributed to conflict with Prussian towns and nobles. The Confederation and its rebellion in 1454 reveal the limits of rule sustained only by military authority.\nWhy this mission (historical problem; fictional resolution): A funded reserve answers the debt problem with solvency. It should precede continental ambitions, rather than appear as a prize after conquest.\nSource: Prussian crisis [S04]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Use audited accounts to stabilize income and borrowing. Retain 100 ducats without a deficit or excessive loans. Cheaper credit is useful before institutions and expeditions; the reserve is not spent by the mission.\n\nSource: https://academic.oup.com/book/32707/chapter-abstract/271969969\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a51_title:0 "Remember the Hospital"
 owe_a51_desc:0 "Remember the Hospital\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (historical problem; fictional resolution): Restore the hospital obligation before demanding a new crusade. The first institution is deliberately small enough for the opening treasury.\nSource: Order history [S01]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Fund one hospital through the regional foundation menu. Restore the charitable function before expanding the network. Small prestige is appropriate here; schools, inspections and further hospitals open next.\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b12_title:0 "The Samogitian Question"
 owe_b12_desc:0 "The Samogitian Question\n\nHistorical root: At Constance, Polish-Lithuanian representatives challenged Teutonic conduct. The controversy concerned Christianization and its credibility; it cannot be reduced to a permanently pagan Lithuania. Samogitia received a diocese in 1417.\nWhy this mission (institutional precedent; counterfactual development): A territorial corridor and the faith of its inhabitants are separate questions. The narrative must acknowledge that conversion undermines the old crusading justification.\nSource: Constance study [S03]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Curonia. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use Samogitian claims, an accommodating Lithuanian alliance or formal recognition. Resolve the frontier question through conquest or diplomacy. Curonian claims open B13; recognition never cancels unrelated commissions.\n\nSource: https://journals.phil.muni.cz/studia-historica-brunensia/article/view/27564\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b14_title:0 "A Sea Kept Open"
 owe_b14_desc:0 "A Sea Kept Open\n\nHistorical root: The Order took Gotland in 1398 during Baltic struggles involving piracy, trade and northern rulers. It transferred the island to Margaret in 1408. This was a specific intervention, not a Scandinavian empire.\nWhy this mission (institutional precedent; counterfactual development): The earlier Gotland venture supplies a concrete precedent for an ambitious Baltic fleet. A renewed northern campaign remains optional.\nSource: Gotland history [S11]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: 25. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Follow the Estonian commission or maintain Livonian cooperation. Add light ships and naval experience; land alone is insufficient. Gotland claims open the optional northern theater.\n\nSource: https://gotland.com/article/medeltiden-pa-gotland/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b53_title:0 "A School for the Brethren"
 owe_b53_desc:0 "A School for the Brethren\n\nHistorical root: Institutional literature included history, scripture and saints' lives. The literary tradition supports a learning theme; the mission schools and later universities are invented developments.\nWhy this mission (institutional precedent; counterfactual development): Build on the Order's institutional writing to imagine a school for officers and clerks. Examinations are the fictional reform.\nSource: Order institutions [S15]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Expand A53's two schools to three and employ both administrative and military advisers. Train the brethren through a larger educational institution. Administrative power and adviser savings support subsequent institutional work.\n\nSource: https://deutscher-orden.com/geschichte/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c11_title:0 "Return to the Danube"
 owe_c11_desc:0 "Return to the Danube\n\nHistorical root: Knights under Klaus von Redwitz served on Hungary's southern frontier. A network of nineteen Danube forts and three further sites faced severe financial and military difficulties; the mission ended unsuccessfully.\nWhy this mission (institutional precedent; counterfactual development): Klaus von Redwitz supplies the remembered precedent. The new mission begins with a host agreement and a budget, not a demand for all Hungary.\nSource: Danube study [S05]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: Part of the route to the final chapter. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Bulgaria, Silistria. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use Wallachian claims or secure Hungarian cooperation. Commit a 200-ducat reserve before attempting the Danube deployment. Bulgarian and Silistrian claims provide the land route to forts and a coastal anchorage.\n\nSource: https://dspace.uni.lodz.pl/handle/11089/48252\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c12_title:0 "Supply the Fortresses"
 owe_c12_desc:0 "Fortresses That Can Be Supplied\n\nHistorical root: Knights under Klaus von Redwitz served on Hungary's southern frontier. A network of nineteen Danube forts and three further sites faced severe financial and military difficulties; the mission ended unsuccessfully.\nWhy this mission (institutional precedent; counterfactual development): The Danube precedent makes neglected supplies a central failure state. More forts without money should worsen the crisis.\nSource: Danube study [S05]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: A major story decision with lasting consequences. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: Build two directly owned Danubian forts and subsidize their garrisons. Choose whether to pay the garrison or recall it. C14 requires the paid settlement or two years of recovery; the choice has consequences.\n\nSource: https://dspace.uni.lodz.pl/handle/11089/48252\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c23_title:0 "Ruthenian Crossroads"
 owe_c23_desc:0 "Ruthenian Crossroads\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (institutional precedent; counterfactual development): A Baltic army needs a viable route to the southern frontier. Corridor diplomacy is an original gameplay solution to that geographical constraint.\nSource: Commandery study [S06]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Pskov. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use B11's Podlasian and Volhynian claims. Secure three provinces on the Ruthenian approaches. Pskov claims open the independent eastern theater.\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e11_title:0 "Arbitration by Arms"
 owe_e11_desc:0 "Peace at the Point of a Sword\n\nHistorical root: The imperial charter associated with 1226 granted the Order rights in Culm and conquered Prussian territory, including courts, tolls and markets. It was a situated claim of authority, not a universal title.\nWhy this mission (explicit alternate history): The Order now stretches a regional protective office into compulsory arbitration. That escalation, rather than a historical universal mandate, drives the European story.\nSource: Rimini charter [S02]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\nNext commission: Silesia. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Choose the next charge after D34 and develop a state of 500 development. Combine a specific mandate with sufficient political standing. European claims are conditional on the European agenda; other agendas already receive their own first packet.\n\nSource: https://sourcebooks.web.fordham.edu/source/12-13Cbalticcrusade.asp\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e12_title:0 "The Chosen Frontier"
 owe_e12_desc:0 "The Imperial Frontier\n\nHistorical root: The Hohenlohe donation of 1219 established a durable German house. Mergentheim later became the Order's headquarters during the upheavals of the 1520s, demonstrating institutional survival beyond the Prussian state.\nWhy this mission (explicit alternate history): Scattered imperial houses become the pretext for a territorial protectorate. This deliberately exceeds the historical rights of a commandery.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Franconia. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use the frontier packet selected after Jerusalem. Secure Syrian, Pskovian or Silesian objectives according to that agenda. The European branch continues through its authorized commissions; other agendas retain separate theaters.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e14_title:0 "The Right to Be Heard"
 owe_e14_desc:0 "No War Without Our Hearing\n\nHistorical root: The imperial charter associated with 1226 granted the Order rights in Culm and conquered Prussian territory, including courts, tolls and markets. It was a situated claim of authority, not a universal title.\nWhy this mission (explicit alternate history): A hegemon tries to replace diplomacy among equals with its own court. Only states that accepted or were forced into the settlement are bound.\nSource: Rimini charter [S02]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Obtain an ally's consent to arbitration after E11. Combine the accepted proposal with broad standing and prestige. Improved relations reward an actual diplomatic process, with refusal and retry possible.\n\nSource: https://sourcebooks.web.fordham.edu/source/12-13Cbalticcrusade.asp\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f13_title:0 "Eastern Sea Fortresses"
 owe_f13_desc:0 "Fortresses of the Eastern Seas\n\nHistorical root: Montfort was a major Teutonic fortress in the Latin East. Baibars captured and destroyed it in 1271. Rebuilding its estate after a new return to Acre is a counterfactual restoration.\nWhy this mission (explicit alternate history): Montfort provides the precedent of a remote fortified establishment. If the Order later depends on Indian Ocean shipping, it may demand similarly protected supply stations there; the geographical extension is invented.\nSource: Montfort report [S14]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: First establish the Indian compact and its directly owned Malabar house. Fortify that same port, add naval infrastructure and expand the heavy fleet. Ship repair rewards the optional military upgrade; Malacca claims now belong only to G54.\n\nThe Order overseas: Establish the Indian house and begin three years of frontier service through its decision. A fortified Malabar commandery recognizes trained brethren only after their service term. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://hadashot.iaa.org.il/Report_Detail.aspx?id=26169&print=nopic\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f14_title:0 "No Distant Rival"
 owe_f14_desc:0 "No Distant Rival\n\nHistorical root: The Order took Gotland in 1398 during Baltic struggles involving piracy, trade and northern rulers. It transferred the island to Margaret in 1408. This was a specific intervention, not a Scandinavian empire.\nWhy this mission (explicit alternate history): Naval predominance extends the old Baltic protection argument across oceans. The new claim to police every route is intentionally imperial.\nSource: Gotland history [S11]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Develop a 2,200-development state, a two-hundred-regiment army and thirty heavy ships. Demonstrate global military reach after building the eastern fortress. A temporary ten-percent heavy-ship benefit caps this optional naval challenge.\n\nThe Order overseas: Marshal an army through four distant fortified commanderies. Experienced brethren earn 10 army tradition and five-percent cheaper reinforcement for twenty years, replacing the old generic fleet bonus. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://gotland.com/article/medeltiden-pa-gotland/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g13_title:0 "Scandinavian Stations"
 owe_g13_desc:0 "Scandinavian Stations\n\nHistorical root: Danzig, Thorn, Elbing and other Prussian towns participated in Baltic commercial networks. Urban privileges and merchants' interests made commerce a political relationship, not simply the Order's private income.\nWhy this mission (explicit alternate history): Scandinavian stations link convoy protection to host-city privileges. Annexed ports still require reconstruction and a local charter.\nSource: Baltic trade [S07]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Mecklenburg, Vorpommern. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Follow the previous Scandinavian packet. Hold four provinces in the named areas. Mecklenburg and Pomeranian claims continue the southern-shore branch.\n\nSource: https://westpreussisches-landesmuseum.de/en/exhibitions/featured-sections/featured-section-baltic-sea-trade-and-industry/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g14_title:0 "The Southern Shore"
 owe_g14_desc:0 "The Southern Shore\n\nHistorical root: Danzig, Thorn, Elbing and other Prussian towns participated in Baltic commercial networks. Urban privileges and merchants' interests made commerce a political relationship, not simply the Order's private income.\nWhy this mission (explicit alternate history): Southern Baltic ports become the next stage of commercial consolidation. The mission's territorial program is invented and openly competes with neighboring rulers.\nSource: Baltic trade [S07]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Svealand, Jutland. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use the southern Baltic coastal commission. Secure three ports in the named areas. Svealand and Jutland claims prepare the next northern settlement.\n\nSource: https://westpreussisches-landesmuseum.de/en/exhibitions/featured-sections/featured-section-baltic-sea-trade-and-industry/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g25_title:0 "Steppe Landmeisters"
 owe_g25_desc:0 "Landmeisters of the Steppe\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (explicit alternate history): Landmeisters provide the historical title for an invented steppe administration. Regional autonomy substitutes for pretending that settled knights become a horde.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\nNext commission: Circassia, Dagestan. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Follow the Lower Don commission. Control three provinces on the next approach. Circassian and Dagestani claims prepare the Caucasian frontier.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g34_title:0 "The Levantine Hinterland"
 owe_g34_desc:0 "The Levantine Hinterland\n\nHistorical root: Montfort was a major Teutonic fortress in the Latin East. Baibars captured and destroyed it in 1271. Rebuilding its estate after a new return to Acre is a counterfactual restoration.\nWhy this mission (explicit alternate history): Use restored Montfort as a reference point for securing the inland approaches. Damascus and beyond are the invented protective frontier of a second Outremer.\nSource: Montfort report [S14]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\nNext commission: Delta. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use the hinterland packet. Secure three Syrian and two Transjordanian provinces. Delta claims prepare Alexandria and the Egyptian branch.\n\nSource: https://hadashot.iaa.org.il/Report_Detail.aspx?id=26169&print=nopic\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g35_title:0 "The Harbor of Alexandria"
 owe_g35_desc:0 "The Harbor of Alexandria\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (explicit alternate history): After securing Jerusalem in this timeline, the chapter fears dependence on rival-controlled grain and shipping. It therefore turns pilgrimage protection into an argument for taking Alexandria. The Acre hospital is historical; this Egyptian strategy is our counterfactual escalation.\nSource: Order history [S01]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\nNext commission: Bahari, Vostani. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Follow the Delta commission and develop Alexandria's market. Hold a repaired commercial harbor, directly or through a subject. Bahari and Vostani claims extend the Nile settlement.\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g36_title:0 "The Nile Settlement"
 owe_g36_desc:0 "The Nile Settlement\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (explicit alternate history): Grain supply is the practical payoff, but conquest requires a tax settlement and recovery. A devastated Nile should not immediately subsidize the world.\nSource: Commandery study [S06]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Use the Egyptian packets, then restore peace and stability. Secure the specified Delta, Bahari and Vostani holdings. Up to three owned grain provinces gain production; an entirely subject-held settlement receives prestige instead.\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g43_title:0 "The Western Crown"
 owe_g43_desc:0 "The Western Crown\n\nHistorical root: The imperial charter associated with 1226 granted the Order rights in Culm and conquered Prussian territory, including courts, tolls and markets. It was a situated claim of authority, not a universal title.\nWhy this mission (explicit alternate history): The Order's limited chartered authority has become a demand upon a major crown. This is counterfactual hegemony, with an explicit resistance problem.\nSource: Rimini charter [S02]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Catalonia. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Follow the western commission. Secure four target provinces and conclude the war. Catalonian claims open a limited Iberian foothold, not a free claim on all Iberia.\n\nSource: https://sourcebooks.web.fordham.edu/source/12-13Cbalticcrusade.asp\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g44_title:0 "The Iberian Settlement"
 owe_g44_desc:0 "The Iberian Settlement\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (explicit alternate history): Iberian maritime reach tempts the protector into oceanic policy. A European settlement does not silently hand over overseas subjects or exploration.\nSource: Commandery study [S06]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: A major story decision with lasting consequences. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Lazio. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use the Catalonian commission and retain a 500-ducat reserve. Choose respect for Rome or a confrontational papal ambition. Only confrontation can issue Lazio claims, and it carries diplomatic and unrest costs.\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g51_title:0 "The Atlantic Gates"
 owe_g51_desc:0 "The Atlantic Gates\n\nHistorical root: The Order took Gotland in 1398 during Baltic struggles involving piracy, trade and northern rulers. It transferred the island to Margaret in 1408. This was a specific intervention, not a Scandinavian empire.\nWhy this mission (explicit alternate history): The first oceanic gates stretch the Baltic naval tradition into a new era. Range, exploration and a paid expedition remain necessary.\nSource: Gotland history [S11]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Macaronesia. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Reach a western European port and diplomatic technology fifteen. Prepare the Atlantic route before F22's American footholds. A discovered settled Macaronesian station can be claimed; this does not supply an explorer or a colony. Overseas claims cover settled, discovered foreign land. Use normal exploration and colonization, conquest of an existing settlement, or subject expansion to establish a foothold. Claims neither discover nor colonize empty land.\n\nThe Order overseas: Prepare the Order's Atlantic approach. Claims support an earned station; exploration, settlement and foreign consent remain ordinary game requirements. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://gotland.com/article/medeltiden-pa-gotland/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g52_title:0 "The Western Commanderies"
 owe_g52_desc:0 "The Western Commanderies\n\nHistorical root: The Hohenlohe donation of 1219 established a durable German house. Mergentheim later became the Order's headquarters during the upheavals of the 1520s, demonstrating institutional survival beyond the Prussian state.\nWhy this mission (explicit alternate history): A western chapter borrows the durable-house model while inventing a new colonial setting. It must negotiate competing local and settler claims.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Expand F22's western footholds to ten American provinces. Consolidate directly or through subjects. Colonial nations receive tariff support, directly owned provinces receive local trade benefits, and other subject-only arrangements receive diplomatic power. Overseas claims cover settled, discovered foreign land. Use normal exploration and colonization, conquest of an existing settlement, or subject expansion to establish a foothold. Claims neither discover nor colonize empty land.\n\nThe Order overseas: Consolidate the western bailiwick through its direct estates or subject representation. Rewards follow the actual form of government: colonial revenue, local trade, or diplomatic support. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a14_title:0 "No Second Tannenberg"
 owe_a14_desc:0 "No Second Tannenberg\n\nHistorical root: The Order suffered a major defeat against the Polish-Lithuanian coalition in 1410. The campaign treats that defeat as institutional memory at the 1444 start.\nWhy this mission (historical problem; fictional resolution): The alternate outcome is an Order that learns restraint from defeat. A credible defensive settlement can count alongside battlefield victory.\nSource: Order chronology [S16]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: A major story decision with lasting consequences. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: Recover the paid army and accumulate tradition through normal service. Choose how to treat a wounded commander; the recovery option takes time. A living general or the lessons of his loss conclude the opening military branch.\n\nSource: https://www.deutscherorden.de/site/schwestern/geschichtlicherhintergrun\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a21_title:0 "Livonian Letters"
 owe_a21_desc:0 "The Livonian Correspondence\n\nHistorical root: The Livonian branch operated amid bishops, towns and competing jurisdictions. Its relationship with the wider Order did not erase local institutions or conflicts over authority.\nWhy this mission (historical problem; fictional resolution): Correspondence begins cooperation between distinct administrations. Livonian brothers should have demands of their own, not automatically obey every Prussian order.\nSource: Livonian history [S08]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Contact Livonia at the start; recover Livland if that state has disappeared. Secure an allied, subject or territorial connection to the sister chapter. Diplomatic power helps the imperial petition and the Livonian settlement.\n\nSource: https://tallinnmuseum.com/2018/10/13/the-teutonic-order-in-medieval-livonia/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a23_title:0 "Defend the Charters"
 owe_a23_desc:0 "Defend the Charters\n\nHistorical root: The imperial charter associated with 1226 granted the Order rights in Culm and conquered Prussian territory, including courts, tolls and markets. It was a situated claim of authority, not a universal title.\nWhy this mission (historical problem; fictional resolution): A rights dossier should identify specific disputed estates. The Order cannot turn a medieval privilege into ownership of every neighboring kingdom.\nSource: Rimini charter [S02]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\nNext commission: Samogitia. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Hire a diplomatic adviser and fund the charter defense after A22. Complete the specific charter decision, not merely accumulate prestige. Samogitian claims support B12; recognizing Christian Lithuania offers another route.\n\nSource: https://sourcebooks.web.fordham.edu/source/12-13Cbalticcrusade.asp\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a32_title:0 "Hear the Confederation"
 owe_a32_desc:0 "Hear the Confederation\n\nHistorical root: War costs and taxation contributed to conflict with Prussian towns and nobles. The Confederation and its rebellion in 1454 reveal the limits of rule sustained only by military authority.\nWhy this mission (historical problem; fictional resolution): Hear towns and gentry as political actors. Concessions reduce immediate revenue, while coercion leaves a revolt risk even after military success.\nSource: Prussian crisis [S04]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: A major story decision with lasting consequences. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: Retain Danzig and hear the estates after the audit. Choose urban concessions or a punitive trial. Both open A33; punishment leaves unrest that must be settled first.\n\nSource: https://academic.oup.com/book/32707/chapter-abstract/271969969\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b11_title:0 "The Polish Settlement"
 owe_b11_desc:0 "The Polish Settlement\n\nHistorical root: War costs and taxation contributed to conflict with Prussian towns and nobles. The Confederation and its rebellion in 1454 reveal the limits of rule sustained only by military authority.\nWhy this mission (institutional precedent; counterfactual development): A Polish border settlement can be negotiated or imposed. An imposed treaty does not transform the opponent's religion into a crusading pretext.\nSource: Prussian crisis [S04]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: A major story decision with lasting consequences. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Podlasie, Volhynia. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use A11's Kuyavian claims or secure a Polish alliance with high opinion. Conclude the border settlement at peace and choose recognition or revisionism. Podlasie and Volhynia claims prepare C23; only revisionism adds Greater Poland.\n\nSource: https://academic.oup.com/book/32707/chapter-abstract/271969969\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b22_title:0 "The Liberties of Riga"
 owe_b22_desc:0 "The Liberties of Riga\n\nHistorical root: The Livonian branch operated amid bishops, towns and competing jurisdictions. Its relationship with the wider Order did not erase local institutions or conflicts over authority.\nWhy this mission (institutional precedent; counterfactual development): Riga's position belongs in a contest between urban, episcopal and military authority. Require a civic settlement after conquest as well as after diplomacy.\nSource: Livonian history [S08]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: A major story decision with lasting consequences.\n\nCampaign progression: Approach Riga as an ally, subject or directly controlled city. Choose civic liberties or a military administration where ownership permits it. The choice changes Riga's institutions and concludes its local political story.\n\nSource: https://tallinnmuseum.com/2018/10/13/the-teutonic-order-in-medieval-livonia/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b54_title:0 "Beyond the Baltic"
 owe_b54_desc:0 "A Mission Beyond the Baltic\n\nHistorical root: Knights under Klaus von Redwitz served on Hungary's southern frontier. A network of nineteen Danube forts and three further sites faced severe financial and military difficulties; the mission ended unsuccessfully.\nWhy this mission (institutional precedent; counterfactual development): The failed Hungarian venture gives the chapter a specific project to renew. Its new commission must solve the funding problem before seeking glory.\nSource: Danube study [S05]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: Part of the route to the final chapter.\nNext commission: Wallachia. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Fund the chapter's new purpose after A34. Authorize a southern undertaking through the chapter decision. Wallachian claims support C11; Hungarian cooperation is an alternative entry.\n\nSource: https://dspace.uni.lodz.pl/handle/11089/48252\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c22_title:0 "The Wallachian Compact"
 owe_c22_desc:0 "The Wallachian Compact\n\nHistorical root: Knights under Klaus von Redwitz served on Hungary's southern frontier. A network of nineteen Danube forts and three further sites faced severe financial and military difficulties; the mission ended unsuccessfully.\nWhy this mission (institutional precedent; counterfactual development): Make Wallachia a partner with its own succession and local interests. A march offers troops in exchange for powers the Grand Master must respect.\nSource: Danube study [S05]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Use the Wallachian commission or negotiate with Wallachia. Establish a local ally, subject or territorial compact. This is an optional diplomatic settlement, not a compulsory annexation step.\n\nSource: https://dspace.uni.lodz.pl/handle/11089/48252\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c41_title:0 "Supply Before Glory"
 owe_c41_desc:0 "Supply Before Glory\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (institutional precedent; counterfactual development): The treasury must distinguish an expedition from routine garrison service. Stored resources limit how many distant fronts can operate at once.\nSource: Commandery study [S06]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Complete the Danube commission and retain four houses, an adviser and supplies. Prepare a 200-ducat supply reserve before extending regional roads. Logistical support leads to C43; the claim provider now explicitly precedes this route.\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_d33_title:0 "Reform the Rule"
 owe_d33_desc:0 "Reform Without Dissolution\n\nHistorical root: Albrecht adopted Lutheranism and transformed the Prussian Order state into a hereditary duchy under Polish overlordship in 1525. The Order itself continued outside that duchy.\nWhy this mission (explicit alternate history): The Reformation tests corporate survival as well as belief. The branch imagines reform without the historical secularization of Prussia.\nSource: Order chronology [S16]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Ratify the Rule after the succession choice. Pay for the institutional reform at administrative technology ten. Idea-cost relief supports a wider state; E31 now explicitly follows this reform.\n\nSource: https://www.deutscherorden.de/site/schwestern/geschichtlicherhintergrun\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_d52_title:0 "Judges of Many Tongues"
 owe_d52_desc:0 "Judges of Many Tongues\n\nHistorical root: At Constance, Polish-Lithuanian representatives challenged Teutonic conduct. The controversy concerned Christianization and its credibility; it cannot be reduced to a permanently pagan Lithuania. Samogitia received a diocese in 1417.\nWhy this mission (explicit alternate history): Use multilingual courts to expose conflicting property claims and legal traditions. The proposed settlement is an imagined response to governing a diverse population.\nSource: Constance study [S03]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Apply the Common Court while accepting two cultures. Train an administration able to work across communities. Lower culture-promotion cost encourages further integration.\n\nSource: https://journals.phil.muni.cz/studia-historica-brunensia/article/view/27564\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e22_title:0 "The Papal Question"
 owe_e22_desc:0 "The Papal Question\n\nHistorical root: The imperial charter associated with 1226 granted the Order rights in Culm and conquered Prussian territory, including courts, tolls and markets. It was a situated claim of authority, not a universal title.\nWhy this mission (explicit alternate history): Papal recognition and papal captivity are different political conditions. The coercive branch exposes the contradiction between service and domination.\nSource: Rimini charter [S02]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Negotiate with an independent friendly pope or control Rome. Fund the matching papal policy, including its concessions or coercive costs. The settlement can later support a concordat at G45; force is not the only option.\n\nSource: https://sourcebooks.web.fordham.edu/source/12-13Cbalticcrusade.asp\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e32_title:0 "The Chapters Revolt"
 owe_e32_desc:0 "The Revolt of the Chapters\n\nHistorical root: War costs and taxation contributed to conflict with Prussian towns and nobles. The Confederation and its rebellion in 1454 reveal the limits of rule sustained only by military authority.\nWhy this mission (explicit alternate history): The Prussian dispute returns on a continental scale: distant taxpayers and officeholders resist rule without adequate consent.\nSource: Prussian crisis [S04]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: A major story decision with lasting consequences. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: Govern forty cities and retain funds after establishing the regional network. Choose federal concessions or depose resistant landmeisters. The crisis establishes the exact settlement that the constitution must respect.\n\nSource: https://academic.oup.com/book/32707/chapter-abstract/271969969\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f12_title:0 "Across the Cape"
 owe_f12_desc:0 "Across the Cape\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (explicit alternate history): An overseas house becomes the stepping stone to another. The Cape route is a declared extension of commandery logistics, not a documented medieval plan.\nSource: Commandery study [S06]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Central Swahili Coast. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use the Cape commission if settled, or establish a foothold through ordinary colonial play. Hold a Cape province with the convoy capacity and financing branch complete. One central Swahili coastal claim prepares a single supported station at G53. Overseas claims cover settled, discovered foreign land. Use normal exploration and colonization, conquest of an existing settlement, or subject expansion to establish a foothold. Claims neither discover nor colonize empty land.\n\nThe Order overseas: A Cape foothold supplies the next oceanic deployment. The next claim covers one Swahili port; equip it as an Order station rather than claiming an entire coast. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f24_title:0 "Protector of Crowns"
 owe_f24_desc:0 "One Protector, Many Crowns\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (explicit alternate history): The protector presides over rulers it has not necessarily annexed. Shared succession rules become urgent once the institution spans oceans.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Use the congress to consolidate a genuinely global network. Reach 1,250 development with four subjects or ninety cities, keeping subjects below fifty liberty desire. Loyalty relief helps subjects; a state without subjects receives 50 administrative power before the 1,500-development crisis.\n\nThe Order overseas: The overseas profession must now become an operating institution. The Marshal needs three fortified distant commanderies and reserves; the Spitler needs five distant hospitals and three schools of the state faith. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f52_title:0 "Whose Salvation?"
 owe_f52_desc:0 "Whose Salvation?\n\nHistorical root: At Constance, Polish-Lithuanian representatives challenged Teutonic conduct. The controversy concerned Christianization and its credibility; it cannot be reduced to a permanently pagan Lithuania. Samogitia received a diocese in 1417.\nWhy this mission (explicit alternate history): The old controversy over Christianization becomes a debate about intervention itself. The fictional order must explain whom its protection actually serves.\nSource: Constance study [S03]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Use two genuinely distant houses to settle overseas religious policy. Choose local accommodation or missionary funding with an explicit tradeoff. Temporary tolerance complements the permanent policy; neither option requires keeping provinces unconverted.\n\nThe Order overseas: Decide the overseas religious policy and establish two distant schools of the state faith. One qualifying school becomes a college of priest-brothers with local conversion and institution support for twenty years. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://journals.phil.muni.cz/studia-historica-brunensia/article/view/27564\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f54_title:0 "Judge the Protector"
 owe_f54_desc:0 "Judge the Protector\n\nHistorical root: The imperial charter associated with 1226 granted the Order rights in Culm and conquered Prussian territory, including courts, tolls and markets. It was a situated claim of authority, not a universal title.\nWhy this mission (explicit alternate history): A universal protector faces a court able to judge its own officials. Independence of that court is the final test of the chosen constitution.\nSource: Rimini charter [S02]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: A major story decision with lasting consequences. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: Bring the membership branch and the protector's crisis together. An inquiry requires clean finances; an indemnity requires five years and low exhaustion. Choose restitution or pardon; the final chapter then judges continuity and solvency.\n\nThe Order overseas: Bring provincial brethren and the protector before the chapter. The existing restitution-or-pardon choice remains the institutional judgment before the final constitution. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://sourcebooks.web.fordham.edu/source/12-13Cbalticcrusade.asp\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g15_title:0 "The Northern Crowns"
 owe_g15_desc:0 "The Northern Crowns\n\nHistorical root: The Order took Gotland in 1398 during Baltic struggles involving piracy, trade and northern rulers. It transferred the island to Margaret in 1408. This was a specific intervention, not a Scandinavian empire.\nWhy this mission (explicit alternate history): An anti-piracy precedent has become a demand that northern crowns obey the Order. The escalation should trigger an organized opposition event.\nSource: Gotland history [S11]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Finland, Norrland. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use the next northern packet. Hold four provinces under stable rule. Finnish and Norrland claims prepare the final regional naval challenge.\n\nSource: https://gotland.com/article/medeltiden-pa-gotland/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g16_title:0 "A Baltic Without Rivals"
 owe_g16_desc:0 "A Baltic Without Rivals\n\nHistorical root: The Order took Gotland in 1398 during Baltic struggles involving piracy, trade and northern rulers. It transferred the island to Margaret in 1408. This was a specific intervention, not a Scandinavian empire.\nWhy this mission (explicit alternate history): The Baltic endpoint is regional primacy, achieved and then maintained. It does not exempt the hegemon from renewed coalitions or naval upkeep.\nSource: Gotland history [S11]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: Complete the last northern commission and develop maritime revenue. Hold five frontier provinces, sixty ships and the required trade share. A bounded naval and trade modifier ends the Baltic theater.\n\nSource: https://gotland.com/article/medeltiden-pa-gotland/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g21_title:0 "The Pskov Approach"
 owe_g21_desc:0 "The Pskov Approach\n\nHistorical root: The Livonian branch operated amid bishops, towns and competing jurisdictions. Its relationship with the wider Order did not erase local institutions or conflicts over authority.\nWhy this mission (explicit alternate history): The Livonian frontier motivates interest in Pskov, but a regional border dispute does not prove a historical plan to rule Russia.\nSource: Livonian history [S08]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\nNext commission: Novgorod. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use C23's Pskov commission. Establish the first eastern foothold. Novgorodian claims extend the route to a commercial center.\n\nSource: https://tallinnmuseum.com/2018/10/13/the-teutonic-order-in-medieval-livonia/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g22_title:0 "The Markets of Novgorod"
 owe_g22_desc:0 "The Markets of Novgorod\n\nHistorical root: Danzig, Thorn, Elbing and other Prussian towns participated in Baltic commercial networks. Urban privileges and merchants' interests made commerce a political relationship, not simply the Order's private income.\nWhy this mission (explicit alternate history): Novgorod's commercial role gives the campaign an economic motive. Political subordination is a separate and more coercive objective than trading access.\nSource: Baltic trade [S07]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\nNext commission: Tver, Moscow. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Follow the Novgorodian packet. Control three provinces in the named area. Tver and Moscow claims prepare the next political confrontation.\n\nSource: https://westpreussisches-landesmuseum.de/en/exhibitions/featured-sections/featured-section-baltic-sea-trade-and-industry/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g23_title:0 "Moscow's Answer"
 owe_g23_desc:0 "Moscow's Answer\n\nHistorical root: At Constance, Polish-Lithuanian representatives challenged Teutonic conduct. The controversy concerned Christianization and its credibility; it cannot be reduced to a permanently pagan Lithuania. Samogitia received a diocese in 1417.\nWhy this mission (explicit alternate history): The eastern agenda crosses a confessional boundary without discovering a pagan target. Russian supremacy is a deliberate geopolitical invention.\nSource: Constance study [S03]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\nNext commission: Kazan, Volga. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use the Muscovite commission. Hold Moscow and three provinces in its area, then make peace. Kazan and Volga claims support the inland supply chain.\n\nSource: https://journals.phil.muni.cz/studia-historica-brunensia/article/view/27564\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g31_title:0 "The Balkan Advance"
 owe_g31_desc:0 "The Balkan Advance\n\nHistorical root: Knights under Klaus von Redwitz served on Hungary's southern frontier. A network of nineteen Danube forts and three further sites faced severe financial and military difficulties; the mission ended unsuccessfully.\nWhy this mission (explicit alternate history): A revived defensive commission becomes an offensive Balkan protectorate. Rebuilding the districts exposes the cost of that transformation.\nSource: Danube study [S05]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Macedonia, Hudavendigar. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use C14's Thracian claims and recover manpower. Secure three Thracian provinces before pressing onward. Macedonian and Hudavendigar claims open the Bosporus campaign.\n\nSource: https://dspace.uni.lodz.pl/handle/11089/48252\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g32_title:0 "The Bosporus Command"
 owe_g32_desc:0 "The Bosporus Command\n\nHistorical root: The Order's early activity included service in the Hungarian Burzenland under Hermann von Salza. That precedent supplies a frontier-service theme; the later protectorate hierarchy is invented.\nWhy this mission (explicit alternate history): The invited defender has become a regional sovereign. Control of the straits creates an argument for further war, not a legitimate universal empire.\nSource: Order institutions [S15]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\nNext commission: Aydin. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Follow the Bosporus commission while retaining the earlier Thracian route. Hold Constantinople and two Hudavendigar provinces. Aydin claims support the next Anatolian advance.\n\nSource: https://deutscher-orden.com/geschichte/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g42_title:0 "The Rhine's Commanderies"
 owe_g42_desc:0 "The Rhine's Commanderies\n\nHistorical root: The Hohenlohe donation of 1219 established a durable German house. Mergentheim later became the Order's headquarters during the upheavals of the 1520s, demonstrating institutional survival beyond the Prussian state.\nWhy this mission (explicit alternate history): Endowments and local houses become a territorial corridor only under the coercive route. Treaty-hosted houses retain their hosts' sovereignty.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\nNext commission: Lorraine, Champagne. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use the Rhine packet. Hold the specified Rhine and Palatinate provinces. Lorraine and Champagne claims prepare the western advance.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g46_title:0 "European Peace"
 owe_g46_desc:0 "The Peace of the Continent\n\nHistorical root: War costs and taxation contributed to conflict with Prussian towns and nobles. The Confederation and its rebellion in 1454 reveal the limits of rule sustained only by military authority.\nWhy this mission (explicit alternate history): The continent repeats the provincial problem: an imposed settlement needs money, representation or sustained coercion to survive.\nSource: Prussian crisis [S04]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Ratify continental peace after the Roman settlement. End war, exhaustion and instability while retaining prestige. Diplomatic authority and modest unrest relief conclude this optional theater.\n\nSource: https://academic.oup.com/book/32707/chapter-abstract/271969969\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g56_title:0 "The Pacific Settlement"
 owe_g56_desc:0 "The Pacific Settlement\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (explicit alternate history): The general chapter supplies the institutional precedent. In this timeline, Asian trade commitments draw the Order into a final Pacific rivalry, while distant commanders demand representation. No historical Teutonic Pacific program is claimed.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: Use the Fujian commission and establish a directly owned house. Audit the named theater and support it with twenty heavies and one hundred ships. Temporary naval maintenance relief and prestige conclude the Pacific expedition.\n\nThe Order overseas: Complete the Fujian accounts with a local school of the state faith. The Pacific settlement rests on an Order house, religious service and a supporting navy. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a11_title:0 "Count the Banners"
 owe_a11_desc:0 "Count the Banners\n\nHistorical root: The Order suffered a major defeat against the Polish-Lithuanian coalition in 1410. The campaign treats that defeat as institutional memory at the 1444 start.\nWhy this mission (historical problem; fictional resolution): The opening muster treats the memory of 1410 as an administrative warning: count reliable men before promising another grand campaign.\nSource: Order chronology [S16]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: Part of the route to the final chapter.\nNext commission: Kuyavia. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Recruit to 80% of force limit, retain reserves and hire a general. Establish a credible starting army before the Polish border settlement. Kuyavian permanent claims support B11; Poland can instead become an ally.\n\nSource: https://www.deutscherorden.de/site/schwestern/geschichtlicherhintergrun\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a13_title:0 "Repair the Castle Chain"
 owe_a13_desc:0 "Repair the Castle Chain\n\nHistorical root: In 1309 the Grand Master established his seat at Malbork. The castle complex served a governing corporation with administrative, residential and religious functions.\nWhy this mission (historical problem; fictional resolution): Restore the castle network as an expensive working institution, with garrisons and stores, rather than a collection of free fort bonuses.\nSource: Malbork Museum [S10]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Inspect existing castles before buying new forts. Two maintained forts and a small reserve demonstrate readiness. Local defense improves the castle chain; this is an optional defensive investment.\n\nSource: https://zamek.malbork.pl/en/home/visit/history-of-the-castle/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a24_title:0 "A Seat for Livonia"
 owe_a24_desc:0 "A Seat for Livonia\n\nHistorical root: The Livonian branch operated amid bishops, towns and competing jurisdictions. Its relationship with the wider Order did not erase local institutions or conflicts over authority.\nWhy this mission (historical problem; fictional resolution): Give the Livonian chapter an institutional voice in exchange for coordinated defense; breaking that bargain becomes a later constitutional grievance.\nSource: Livonian history [S08]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Improve Livonia's opinion, make it a subject, or control its historic seat after extinction. Establish a represented chapter; extinction does not permanently block this route. An allied Livonia gains mutual trust, subjects gain concessions, or a restored seat earns prestige; the compact follows.\n\nSource: https://tallinnmuseum.com/2018/10/13/the-teutonic-order-in-medieval-livonia/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a33_title:0 "A Settlement for Prussia"
 owe_a33_desc:0 "A Settlement for Prussia\n\nHistorical root: War costs and taxation contributed to conflict with Prussian towns and nobles. The Confederation and its rebellion in 1454 reveal the limits of rule sustained only by military authority.\nWhy this mission (historical problem; fictional resolution): Let survival depend on reconciling territorial authority with provincial privileges. Occupying Danzig alone does not repair the constitutional dispute.\nSource: Prussian crisis [S04]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: Part of the route to the final chapter. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: Resolve the town dilemma, recover Danzig and revoke the Confederation privilege. Meet the installed vanilla Confederation resolution alternatives, including crown land where applicable. The mission now sets the vanilla resolution flag and ends that disaster; local recovery follows.\n\nSource: https://academic.oup.com/book/32707/chapter-abstract/271969969\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a34_title:0 "Renew the Rule"
 owe_a34_desc:0 "Renew the Rule\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (historical problem; fictional resolution): The new rule turns battlefield recovery into a corporate settlement. Regional officers, finances and charitable duties must all be secured.\nSource: Mergentheim Museum [S12]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Combine the Prussian settlement with a credible army. Remain independent and stable after resolving the internal crisis. A small permanent corruption reduction and the wider chapter decisions begin the next stage.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a54_title:0 "The Case for Our Survival"
 owe_a54_desc:0 "The Case for Our Survival\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (historical problem; fictional resolution): The review asks whether the military state still performs its founding service. Donations should depend on conduct and continuing expenditure.\nSource: Order history [S01]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Commission a review while a funded hospital is operating. Turn charitable service into an ecclesiastical case for survival. Modest papal influence rewards this optional institutional branch.\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b24_title:0 "A Baltic Compact"
 owe_b24_desc:0 "A Baltic Compact\n\nHistorical root: The Livonian branch operated amid bishops, towns and competing jurisdictions. Its relationship with the wider Order did not erase local institutions or conflicts over authority.\nWhy this mission (institutional precedent; counterfactual development): A Baltic compact extends a divided regional order into collective security. It should require explicit promises, subsidies and consent.\nSource: Livonian history [S08]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Broaden chapter representation or obtain Livonia's consent to a constitution. Three partners, territorial scale or the accepted two-ally compact establish the league. Diplomatic reputation assists the Baltic settlement; consent does not annex Livonia.\n\nSource: https://tallinnmuseum.com/2018/10/13/the-teutonic-order-in-medieval-livonia/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b31_title:0 "Law at the Frontier"
 owe_b31_desc:0 "Law at the Frontier\n\nHistorical root: The imperial charter associated with 1226 granted the Order rights in Culm and conquered Prussian territory, including courts, tolls and markets. It was a situated claim of authority, not a universal title.\nWhy this mission (institutional precedent; counterfactual development): Chartered rule included jurisdiction as well as conquest. Written appeals give territorial expansion a legal cost and a provincial audience.\nSource: Rimini charter [S02]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Establish four commanderies after renewing the Rule. Apply frontier law to an actual institutional network at stability one. Local unrest relief supports the court; culture remains an optional side branch.\n\nSource: https://sourcebooks.web.fordham.edu/source/12-13Cbalticcrusade.asp\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b32_title:0 "Subjects of the Order"
 owe_b32_desc:0 "Subjects of the Order\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (institutional precedent; counterfactual development): Membership reform asks who may share the Order's authority. A broader officer corps is a deliberate alternative to a narrow corporate elite.\nSource: Mergentheim Museum [S12]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Use the new legal network to accommodate provincial communities. Accept two cultures or extend protection through six houses. Lower culture-promotion cost supports diversity without forcing a single ethnic route.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b33_title:0 "A Common Chapter Court"
 owe_b33_desc:0 "A Common Chapter Court\n\nHistorical root: The imperial charter associated with 1226 granted the Order rights in Culm and conquered Prussian territory, including courts, tolls and markets. It was a situated claim of authority, not a universal title.\nWhy this mission (institutional precedent; counterfactual development): Courts can restrain commanders only if a judgment against an influential brother is enforced. Make the first case expensive and consequential.\nSource: Rimini charter [S02]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Fund the Common Court after B31. Certify judicial administration rather than re-count the same buildings. Temporary unrest relief prepares Baltic consolidation and regional protection.\n\nSource: https://sourcebooks.web.fordham.edu/source/12-13Cbalticcrusade.asp\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b34_title:0 "The Baltic Protectorate"
 owe_b34_desc:0 "The Baltic Protectorate\n\nHistorical root: The Order took Gotland in 1398 during Baltic struggles involving piracy, trade and northern rulers. It transferred the island to Margaret in 1408. This was a specific intervention, not a Scandinavian empire.\nWhy this mission (institutional precedent; counterfactual development): Baltic leadership becomes a platform for further commissions, rather than evidence of a historical Scandinavian empire plan.\nSource: Gotland history [S11]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Combine the common court and Baltic compact. Hold ten Baltic provinces, or preserve a consenting Livonian ally alongside six home provinces. A restrained permanent trade bonus rewards a functioning Baltic settlement; southern expansion follows.\n\nSource: https://gotland.com/article/medeltiden-pa-gotland/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b42_title:0 "Bargain with the Hansa"
 owe_b42_desc:0 "Bargain with the Hansa\n\nHistorical root: Danzig, Thorn, Elbing and other Prussian towns participated in Baltic commercial networks. Urban privileges and merchants' interests made commerce a political relationship, not simply the Order's private income.\nWhy this mission (institutional precedent; counterfactual development): A Hanseatic bargain gives the Order access to credit and shipping while leaving cities their bargaining power.\nSource: Baltic trade [S07]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Use the port markets to raise trade to one fifth of income. Demonstrate a commercially supported state. Trade efficiency is an optional income benefit; it does not imply an actual Hansa treaty event.\n\nSource: https://westpreussisches-landesmuseum.de/en/exhibitions/featured-sections/featured-section-baltic-sea-trade-and-industry/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b52_title:0 "Houses of Relief"
 owe_b52_desc:0 "Houses of Relief\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (institutional precedent; counterfactual development): A chain of endowed houses gives the hospital tradition a continuing function inside a territorial state.\nSource: Order history [S01]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Expand the initial hospital to three funded houses. Sustain a small relief network before taking it to war. Prestige and local tax support lead into the field-medicine branch.\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c31_title:0 "The Master's Commission"
 owe_c31_desc:0 "The Grand Master's Commission\n\nHistorical root: The imperial charter associated with 1226 granted the Order rights in Culm and conquered Prussian territory, including courts, tolls and markets. It was a situated claim of authority, not a universal title.\nWhy this mission (institutional precedent; counterfactual development): A commission should define its theater and purpose. Recognition for one frontier cannot justify wars against every state beyond it.\nSource: Rimini charter [S02]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: After Baltic consolidation, obtain papal support or three Catholic allies. Establish outside legitimacy for renewed intervention. Recognition supports the protection charter and an optional treasury review.\n\nSource: https://sourcebooks.web.fordham.edu/source/12-13Cbalticcrusade.asp\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c32_title:0 "Campaign Accounts"
 owe_c32_desc:0 "Account for Every Campaign\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (institutional precedent; counterfactual development): Audit emergency offices after victory. Successful commanders should become potential provincial rivals rather than a source of free permanent buffs.\nSource: Mergentheim Museum [S12]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Use the original audit and restore sound wartime finances. Reduce loans and exhaustion while ending the deficit. This optional recovery mission helps the next campaign; it is not proof of a won war.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c43_title:0 "Roads to the Frontier"
 owe_c43_desc:0 "Roads to the Frontier\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (institutional precedent; counterfactual development): Use three supply hubs to make the route legible in play. Treaty access should disappear when its host withdraws consent.\nSource: Commandery study [S06]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Establish three low-devastation frontier commanderies and a regional fort. Create an operating supply network beyond C41's financial preparation. Movement and supply benefits prepare a directly controlled coastal base.\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c44_title:0 "Danube Anchorage"
 owe_c44_desc:0 "A Black Sea Anchorage\n\nHistorical root: Knights under Klaus von Redwitz served on Hungary's southern frontier. A network of nineteen Danube forts and three further sites faced severe financial and military difficulties; the mission ended unsuccessfully.\nWhy this mission (institutional precedent; counterfactual development): A Black Sea station follows the southern frontier's logistics. The Order's new maritime reach is an invention requiring a real port and fleet.\nSource: Danube study [S05]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: Part of the route to the final chapter.\nNext commission: Aegean Archipelago. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use C11's Bulgarian and Silistrian claims to reach the coast. Directly own a Danubian port that can host the station decision. One Aegean permanent claim prepares D11; this no longer accepts an unusable foreign base.\n\nSource: https://dspace.uni.lodz.pl/handle/11089/48252\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_d31_title:0 "The General Visitation"
 owe_d31_desc:0 "The General Visitation\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (explicit alternate history): The farther the headquarters moves from its estates, the more authority local commanders acquire. A costly visitation tests central oversight.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Build three European and three Levantine houses, then commission a visitation. Inspect both halves of the Order before deciding who rules them. Administrative power supports the succession debate and reform of the Rule.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_d32_title:0 "Prince or Master"
 owe_d32_desc:0 "The Temptation of Princes\n\nHistorical root: Albrecht adopted Lutheranism and transformed the Prussian Order state into a hereditary duchy under Polish overlordship in 1525. The Order itself continued outside that duchy.\nWhy this mission (explicit alternate history): Albrecht's conversion of Prussia into a hereditary duchy supplies a concrete institutional danger. Preserving the elective Order is the alternative outcome.\nSource: Order chronology [S16]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: A major story decision with lasting consequences. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: After the visitation, secure technology, prestige and stability. Choose elective accountability or life tenure for officeholders. The actual settlement unlocks the reform decision; later constitutional ambitions inherit it.\n\nSource: https://www.deutscherorden.de/site/schwestern/geschichtlicherhintergrun\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_d41_title:0 "Pilgrim Convoys"
 owe_d41_desc:0 "The Mediterranean Convoys\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (explicit alternate history): The sea crossing is a continuing expense. Keep escorts and transport capacity visible after the first triumphant landing.\nSource: Commandery study [S06]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Prepare twenty transports, fifteen light escorts and a reserve after reaching the Danube coast. Build the convoy system before claiming the Aegean mission. Naval maintenance relief makes the subsequent expedition sustainable.\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e13_title:0 "Deter the League"
 owe_e13_desc:0 "Break the Counter-League\n\nHistorical root: The Order suffered a major defeat against the Polish-Lithuanian coalition in 1410. The campaign treats that defeat as institutional memory at the 1444 start.\nWhy this mission (explicit alternate history): The defeat of 1410 supplies the historical warning. In this timeline, a greatly expanded Order has frightened its neighbors into a new counter-league; surviving their resistance tests whether it has learned from that defeat.\nSource: Order chronology [S16]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Develop a 750-development state and an experienced seventy-regiment army. Demonstrate credible deterrence at peace; this does not pretend the engine recorded a coalition victory. Temporary morale helps face later opponents without permanently increasing army quality.\n\nThe Order overseas: Muster the Marshal's field command through three fortified commanderies and a military adviser. A Christian Order combines its experienced army with staffed houses before confronting a possible counter-league. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://www.deutscherorden.de/site/schwestern/geschichtlicherhintergrun\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e21_title:0 "A Congress of Crowns"
 owe_e21_desc:0 "A Congress of Crowns\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (explicit alternate history): The general chapter inspires a congress of outside rulers. Extending corporate procedure to foreign sovereigns is explicitly fictional.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Develop a substantial network of allies, subjects or directly governed cities. Reach the standing needed to address crowns as a peer. Diplomatic reputation helps the separate papal and imperial questions.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e23_title:0 "The Emperor's Answer"
 owe_e23_desc:0 "The Emperor's Answer\n\nHistorical root: The Hohenlohe donation of 1219 established a durable German house. Mergentheim later became the Order's headquarters during the upheavals of the 1520s, demonstrating institutional survival beyond the Prussian state.\nWhy this mission (explicit alternate history): The Order's imperial connections create a route to service or confrontation. Its theocratic government does not simply inherit the imperial crown.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: After the congress, approach the actual emperor or establish another imperial settlement. Become emperor, dissolve the HRE, gain imperial recognition, or secure a meaningful German foothold. Reduced aggressive expansion supports consolidation; E21's generic partner count no longer completes this automatically.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e24_title:0 "The Crownless Hegemon"
 owe_e24_desc:0 "The Crownless Hegemon\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (explicit alternate history): The Grand Master becomes a supervisor of crowns while remaining an elected corporate officer. That invented contradiction feeds the coming chapter revolt.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Follow the imperial settlement with 1,000 development, prestige and peace. Establish continental weight after resolving its political status. Subject loyalty supports a composite state; direct administration receives 50 administrative power instead.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e33_title:0 "The Great Constitution"
 owe_e33_desc:0 "The Great Constitution\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (explicit alternate history): Mergentheim's chapter practice supplies the institutional vocabulary, while a constitution governing an empire is the deliberate extrapolation.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: Ratify a constitution consistent with E32. Federal rule expands to fourteen houses; coercive rule must recover stability, tradition and reserves. Cheaper stability supports consolidation; this is not a replay of the original twelve-house requirement.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e34_title:0 "Universal Protectorate"
 owe_e34_desc:0 "The Universal Protectorate\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (explicit alternate history): The protector claims that service authorizes intervention everywhere. This fictional doctrine opens the global act and its legitimacy crisis.\nSource: Order history [S01]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\nNext commission: Galicia. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Combine the constitutional and continental political routes. Reach administrative technology fourteen with stability, controlled corruption, peace and manageable loans. Governing capacity and a limited western-port claim prepare the next era without handing out colonies.\n\nThe Order overseas: Carry the Rule into four schools serving the state faith. The continental protectorate must retain its Christian institutional character before expanding overseas. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\nOptional chapter honors: public titles and map liveries can be chosen in Decisions. They are free, reversible cosmetics; no title is forced on the country.\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f11_title:0 "An Oceanic Squadron"
 owe_f11_desc:0 "An Oceanic Squadron\n\nHistorical root: The Order took Gotland in 1398 during Baltic struggles involving piracy, trade and northern rulers. It transferred the island to Margaret in 1408. This was a specific intervention, not a Scandinavian empire.\nWhy this mission (explicit alternate history): The Gotland intervention demonstrates earlier Baltic naval activity. This timeline imagines a richer Order scaling convoy protection into oceanic escort duties after establishing Atlantic bases; it is not evidence of an actual Teutonic Atlantic plan.\nSource: Gotland history [S11]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\nNext commission: Cape Of Good Hope. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use the western-port commission from E34 and build an ocean-capable fleet. Secure a western European port, ten heavies, transports and diplomatic technology fifteen. A limited Cape commission supports the eastern route; normal discovery and colonization are still needed. Overseas claims cover settled, discovered foreign land. Use normal exploration and colonization, conquest of an existing settlement, or subject expansion to establish a foothold. Claims neither discover nor colonize empty land.\n\nThe Order overseas: The Order sends a supply fleet from a western port. The Cape claims open a route for commanderies; profess the overseas Rule once two distant houses are established. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://gotland.com/article/medeltiden-pa-gotland/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f21_title:0 "Overseas Charters"
 owe_f21_desc:0 "Charters Beyond Christendom\n\nHistorical root: The imperial charter associated with 1226 granted the Order rights in Culm and conquered Prussian territory, including courts, tolls and markets. It was a situated claim of authority, not a universal title.\nWhy this mission (explicit alternate history): A charter outside Latin Christendom needs a consenting local authority or openly coercive conquest. Latin paperwork cannot create foreign consent.\nSource: Rimini charter [S02]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Use the oceanic fleet to establish two distant port commanderies. Found houses beyond the old Levantine network, regardless of their religion. Tolerance supports overseas settlement and opens the western and social-policy branches.\n\nThe Order overseas: Endow two distant port commanderies, then profess the Marshal's or Spitler's Rule. The profession precedes the overseas charter; a religion change in the port does not itself invalidate its commandery. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://sourcebooks.web.fordham.edu/source/12-13Cbalticcrusade.asp\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f22_title:0 "The Western Houses"
 owe_f22_desc:0 "The Western Houses\n\nHistorical root: The Hohenlohe donation of 1219 established a durable German house. Mergentheim later became the Order's headquarters during the upheavals of the 1520s, demonstrating institutional survival beyond the Prussian state.\nWhy this mission (explicit alternate history): The German houses show how the Order could operate beyond its Prussian state. An American chapter is an invented extension of that model, made possible only after this campaign acquires Atlantic ships, hosts and sustained funding.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Prepare the Atlantic route and overseas charters, then establish two American ports. Directly owned and subject ports both count, including colonial nations. Owned western houses receive local investment; an entirely subject-held route receives diplomatic support instead. Overseas claims cover settled, discovered foreign land. Use normal exploration and colonization, conquest of an existing settlement, or subject expansion to establish a foothold. Claims neither discover nor colonize empty land.\n\nThe Order overseas: The western houses carry the Order's chosen profession across the Atlantic. Colonial subjects remain valid partners; direct houses and subject representation receive appropriate benefits. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f31_title:0 "The World Chapter"
 owe_f31_desc:0 "The World Chapter\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (explicit alternate history): Historic chapters gathered delegates because universal attendance was impractical. The world chapter extends that representative logic to distant regions.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Convene the World Chapter through its funded decision. Represent Africa and the eastern seas through houses; America may send a loyal subject delegation. Diplomatic standing opens the final political crisis and the decade-long solvency project. An American subject may represent the western chapter; you do not need to prevent colonial nation formation to keep a directly owned American house.\n\nThe Order overseas: Bring the continental and overseas chapters together with three distant schools of the state faith. The Christian world chapter represents more than territory: its priest-brothers must also have real houses. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f32_title:0 "The Protector's Crisis"
 owe_f32_desc:0 "The Crisis of the Protector\n\nHistorical root: War costs and taxation contributed to conflict with Prussian towns and nobles. The Confederation and its rebellion in 1454 reveal the limits of rule sustained only by military authority.\nWhy this mission (explicit alternate history): Subjects ask the old Prussian question at global scale: who may tax them, judge them and bind them to war?\nSource: Prussian crisis [S04]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: A major story decision with lasting consequences. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: Grow from the protectorate's 1,250 development to 1,500 with prestige and stability. Choose an inquiry into the protector or an emergency indemnity. The choice changes the final review conditions; it is not a generic reward selection.\n\nThe Order overseas: The protector must answer to the Order whose institutions sustain him. The existing inquiry or indemnity choice tests whether military necessity can excuse personal authority. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://academic.oup.com/book/32707/chapter-abstract/271969969\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f33_title:0 "An Enduring Order"
 owe_f33_desc:0 "An Order That Outlives Its Master\n\nHistorical root: Albrecht adopted Lutheranism and transformed the Prussian Order state into a hereditary duchy under Polish overlordship in 1525. The Order itself continued outside that duchy.\nWhy this mission (explicit alternate history): The succession settlement tries to prevent either hereditary seizure or fragmentation. Institutional continuity, not the ruler's lifespan, becomes the victory condition.\nSource: Order chronology [S16]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Record two real ruler changes since the Rule was renewed and regain stability two. Certify continuity through the succession decision. Temporary accountability rewards survival across rulers; the mission cannot manufacture succession.\n\nThe Order overseas: Preserve the Rule through two actual successions. Six schools of the state faith and at least 75% religious unity demonstrate continuity beyond one commander. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://www.deutscherorden.de/site/schwestern/geschichtlicherhintergrun\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f34_title:0 "The Order Without End"
 owe_f34_desc:0 "The Order Without End\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (explicit alternate history): The hospital founded at Acre has become the justification for a worldwide political order. The ending exposes that transformation as the campaign's invention.\nSource: Order history [S01]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: A major story decision with lasting consequences.\n\nCampaign progression: Combine orderly succession and the protector's review, then complete ten consecutive solvent years. Reach 2,500 development, high prestige and peace before choosing the final constitution. A restrained permanent federal or protectorate legacy completes the campaign; world conquest remains optional.\n\nThe Order overseas: Complete the final review and solvent decade without abandoning the chosen profession. The Marshal needs six distant fortified houses and reserves; the Spitler needs eight hospitals and five schools of the state faith. The Christian Order then chooses its enduring constitution. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\nOptional chapter honors: public titles and map liveries can be chosen in Decisions. They are free, reversible cosmetics; no title is forced on the country.\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f53_title:0 "Provincial Brothers"
 owe_f53_desc:0 "Subjects Who Can Become Brothers\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (explicit alternate history): Membership ceases to be a peripheral issue once distant subjects finance the institution. Opening offices is a radical invented constitutional settlement.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: After settling religious policy, accept cultures and fund provincial membership. Admit local brethren through the actual recruitment decision. Culture-promotion support prepares the final review of authority.\n\nThe Order overseas: Prepare local brethren through two distant schools within commanderies. A Christian institution can admit provincial members without requiring every local community to convert. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g12_title:0 "The Sound Settlement"
 owe_g12_desc:0 "The Sound Settlement\n\nHistorical root: The Order took Gotland in 1398 during Baltic struggles involving piracy, trade and northern rulers. It transferred the island to Margaret in 1408. This was a specific intervention, not a Scandinavian empire.\nWhy this mission (explicit alternate history): The Order expands an island security policy into control of the Danish gateway. This is the first clear leap beyond the precedent.\nSource: Gotland history [S11]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\nNext commission: Skaneland, Vastra Gotaland. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use the Danish commission or cooperate with Denmark. Resolve the Sound through control or an allied chapter arrangement. Claims in Scania and western Gotaland prepare the Scandinavian stations.\n\nSource: https://gotland.com/article/medeltiden-pa-gotland/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g53_title:0 "The Swahili Stations"
 owe_g53_desc:0 "The Swahili Stations\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (explicit alternate history): East African stations are a logistics choice, not a historical Teutonic objective. Port agreements are possible without annexing entire hinterlands.\nSource: Commandery study [S06]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\nNext commission: Malabar. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use F12's single central Swahili coastal claim. Directly develop that port's naval infrastructure and appoint an admiral. The one-station requirement matches its reward provider and grants a Malabar commission.\n\nThe Order overseas: Endow the claimed Swahili port as a commandery before extending the mission. Naval infrastructure and an admiral support the next Malabar claim. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a31_title:0 "Open the Ledgers"
 owe_a31_desc:0 "Open the Ledgers\n\nHistorical root: War costs and taxation contributed to conflict with Prussian towns and nobles. The Confederation and its rebellion in 1454 reveal the limits of rule sustained only by military authority.\nWhy this mission (historical problem; fictional resolution): Audit extraordinary taxation before demanding more money. The opening fiscal crisis should expose the political price of permanent campaigning.\nSource: Prussian crisis [S04]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Hire an administrative adviser and commission the opening audit. Pay for an actual inspection of the treasury. Reduced inflation and audited accounts prepare the Prussian political settlement.\n\nSource: https://academic.oup.com/book/32707/chapter-abstract/271969969\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a42_title:0 "Grain for the Garrisons"
 owe_a42_desc:0 "Grain for the Garrisons\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (historical problem; fictional resolution): A grain reserve makes the castle network usable. Reward paid provisioning with a small recovery, not a permanent manpower multiplier.\nSource: Commandery study [S06]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Develop two owned grain provinces after reopening Danzig. Produce supplies and retain a modest reserve. Up to three grain provinces gain production efficiency; no compulsory conquest follows.\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a53_title:0 "Local Pastoral Schools"
 owe_a53_desc:0 "Priests Who Speak the Country\n\nHistorical root: At Constance, Polish-Lithuanian representatives challenged Teutonic conduct. The controversy concerned Christianization and its credibility; it cannot be reduced to a permanently pagan Lithuania. Samogitia received a diocese in 1417.\nWhy this mission (historical problem; fictional resolution): A pastor who cannot speak to parishioners cannot answer the Order's legitimacy problem. Language teaching is a fictional reform, not forced cultural replacement.\nSource: Constance study [S03]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Endow two schools in owned communities. Create a pastoral network distinct from the initial hospital. Local missionary support benefits those schools; B53 expands education further.\n\nSource: https://journals.phil.muni.cz/studia-historica-brunensia/article/view/27564\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b21_title:0 "Three Chapters"
 owe_b21_desc:0 "Three Chapters, One Order\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (institutional precedent; counterfactual development): A general chapter provides a historical institutional form for reconciling Prussian, Livonian and German priorities. Their new federation is invented.\nSource: Mergentheim Museum [S12]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Build three houses and assemble chapter representation after A24. Allies, subjects, territorial scale or a restored Livland chapter can supply representation. Cheaper advisers support the compact; Riga and German relations remain side branches.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b23_title:0 "The German Bailiwicks"
 owe_b23_desc:0 "The German Bailiwicks\n\nHistorical root: The Hohenlohe donation of 1219 established a durable German house. Mergentheim later became the Order's headquarters during the upheavals of the 1520s, demonstrating institutional survival beyond the Prussian state.\nWhy this mission (institutional precedent; counterfactual development): Mergentheim demonstrates that a German house could support the Order beyond Prussian fortunes. Overseas recruitment begins with agreements, not German conquest.\nSource: Mergentheim Museum [S12]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Work with German allies or acquire estates in German lands. Demonstrate a real German connection rather than merely generic diplomatic reach. Diplomatic power rewards an optional revival of the bailiwick network.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b41_title:0 "A Prussian Customs Book"
 owe_b41_desc:0 "A Prussian Customs Book\n\nHistorical root: Danzig, Thorn, Elbing and other Prussian towns participated in Baltic commercial networks. Urban privileges and merchants' interests made commerce a political relationship, not simply the Order's private income.\nWhy this mission (institutional precedent; counterfactual development): Uniform customs offer merchants predictability while limiting arbitrary levies. The administrative achievement is the agreement, not limitless trade efficiency.\nSource: Baltic trade [S07]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Extend Danzig's model to four owned port markets. Build a customs network rather than simply increase ship count. Local trade power supports Hansa bargaining and naval construction.\n\nSource: https://westpreussisches-landesmuseum.de/en/exhibitions/featured-sections/featured-section-baltic-sea-trade-and-industry/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b44_title:0 "Finance the Fleet"
 owe_b44_desc:0 "The Sea Pays for the Sword\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (institutional precedent; counterfactual development): Let Baltic revenues finance a new theater only after operating expenses are paid. An expedition reserve is more credible than free ships.\nSource: Commandery study [S06]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Combine the customs network with trade income and reserves. Keep trade at one quarter of income without running a deficit. Lower naval maintenance helps sustain the Mediterranean fleet.\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c13_title:0 "The Field Army"
 owe_c13_desc:0 "The Field Army\n\nHistorical root: Knights under Klaus von Redwitz served on Hungary's southern frontier. A network of nineteen Danube forts and three further sites faced severe financial and military difficulties; the mission ended unsuccessfully.\nWhy this mission (institutional precedent; counterfactual development): A mobile field army supplements fixed defenses. This is the proposed answer to a frontier system that proved unable to withstand sustained pressure.\nSource: Danube study [S05]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Develop military technology seven and recruit a balanced field army. Add artillery and retain reserves rather than only maximize regiment count. The military reward is useful for the Danube wars but remains an optional preparation branch.\n\nSource: https://dspace.uni.lodz.pl/handle/11089/48252\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c14_title:0 "Hold the Crossings"
 owe_c14_desc:0 "Hold the Crossings\n\nHistorical root: Knights under Klaus von Redwitz served on Hungary's southern frontier. A network of nineteen Danube forts and three further sites faced severe financial and military difficulties; the mission ended unsuccessfully.\nWhy this mission (institutional precedent; counterfactual development): Secure crossings give the Order a defensible reason to expand its commission. The successful renewal is explicitly counterfactual.\nSource: Danube study [S05]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Thrace. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Take three provinces covered by C11's commission and settle the garrison dilemma. Hold the crossings at peace with a stable administration. Thracian permanent claims open the optional Balkan and Anatolian campaign.\n\nSource: https://dspace.uni.lodz.pl/handle/11089/48252\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c33_title:0 "The Charter of Protection"
 owe_c33_desc:0 "The Charter of Protection\n\nHistorical root: The imperial charter associated with 1226 granted the Order rights in Culm and conquered Prussian territory, including courts, tolls and markets. It was a situated claim of authority, not a universal title.\nWhy this mission (institutional precedent; counterfactual development): Use charters to specify tribute, courts and defense. The proposed march network expands corporate government without erasing regional obligations.\nSource: Rimini charter [S02]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Expand the court's four-house network to six, including two frontier offices. Apply the Common Court to newly governed Danubian or Ruthenian communities. Protection supports regional administration and the optional collective-defense branch.\n\nSource: https://sourcebooks.web.fordham.edu/source/12-13Cbalticcrusade.asp\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c52_title:0 "The Eastern Christians"
 owe_c52_desc:0 "The Eastern Christians\n\nHistorical root: At Constance, Polish-Lithuanian representatives challenged Teutonic conduct. The controversy concerned Christianization and its credibility; it cannot be reduced to a permanently pagan Lithuania. Samogitia received a diocese in 1417.\nWhy this mission (institutional precedent; counterfactual development): The Baltic legitimacy dispute supplies a warning for Orthodox frontiers. A blanket religious label cannot replace negotiations with actual Christian communities.\nSource: Constance study [S03]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Establish two frontier houses and protect local religious or cultural communities. Orthodox institutions or accepted cultures qualify, so conversion does not permanently block the mission. Temporary tolerance rewards accommodation on this optional branch.\n\nSource: https://journals.phil.muni.cz/studia-historica-brunensia/article/view/27564\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c54_title:0 "Service Worth Defending"
 owe_c54_desc:0 "Service Worth Defending\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (institutional precedent; counterfactual development): Inspect the frontier service through complaints, not only victory reports. A commander who violates the charter becomes a political problem.\nSource: Mergentheim Museum [S12]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Extend the medical network to five operating hospitals and secure review. Demonstrate sustained charitable service. Diplomatic recognition concludes this optional regional relief branch.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_d34_title:0 "The Fulfilled Vow"
 owe_d34_desc:0 "The Fulfilled Vow\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (explicit alternate history): Once the houses and holy sites are secure, the chapter must invent its next purpose. The three new agendas are labeled alternate history.\nSource: Order history [S01]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Syria, Trans Jordan. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Secure the holy cities and honor the Jerusalem arrangement. Custodians need a Jerusalem school and two regional schools; direct rule needs a quiet fortified Jerusalem. Permanent diplomatic standing opens the post-Jerusalem agendas; home schools alone no longer suffice.\nOptional chapter honors: public titles and map liveries can be chosen in Decisions. They are free, reversible cosmetics; no title is forced on the country.\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_d43_title:0 "The Treasury of Two Seas"
 owe_d43_desc:0 "The Treasury of Two Seas\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (explicit alternate history): Separate local endowments from the central war chest. Transfers between the Baltic and Levant are a fictional institutional adaptation.\nSource: Commandery study [S06]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Use the Acre granaries and trade network to raise trade's income share. Fund two theaters without a deficit. Temporary trade efficiency rewards this optional economic branch.\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_d44_title:0 "The Levantine Arsenal"
 owe_d44_desc:0 "An Arsenal Beyond the Baltic\n\nHistorical root: In 1309 the Grand Master established his seat at Malbork. The castle complex served a governing corporation with administrative, residential and religious functions.\nWhy this mission (explicit alternate history): An overseas arsenal repeats the material functions of a fortified headquarters at a much greater distance from home.\nSource: Malbork Museum [S10]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Build a shipyard in an owned Levantine port and employ an admiral. Move repair and construction capacity closer to the expedition. A local arsenal benefit rewards regional investment after the convoy route.\n\nSource: https://zamek.malbork.pl/en/home/visit/history-of-the-castle/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e31_title:0 "One Rule, Many Lands"
 owe_e31_desc:0 "One Rule, Many Lands\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (explicit alternate history): Common accounts and judicial forms collide with regional privileges. Standardization should create a representation dispute alongside its modest administrative benefit.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: Carry D33's reformed Rule into a network of twelve commanderies. Retain representation in Europe and the Levant before chapters dispute authority. Administrative savings precede the chapter crisis and continental financial branches.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e41_title:0 "Credit for Christendom"
 owe_e41_desc:0 "Credit for Christendom\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (explicit alternate history): Turn donated estates and revenue management into an imagined common credit system. A debtor's sovereignty does not disappear because the Order lent money.\nSource: Commandery study [S06]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Finance three partner projects after the continental house network. Establish credit and clear outstanding loans. Interest relief supports large investments; this optional reserve need not be held forever.\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e43_title:0 "The Common Customs"
 owe_e43_desc:0 "The Common Customs\n\nHistorical root: Danzig, Thorn, Elbing and other Prussian towns participated in Baltic commercial networks. Urban privileges and merchants' interests made commerce a political relationship, not simply the Order's private income.\nWhy this mission (explicit alternate history): The merchant bargain expands into an imposed or negotiated customs system. Compensation and enforcement distinguish the two routes.\nSource: Baltic trade [S07]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Apply the house network to a commercially supported treasury. Achieve the specified trade share after establishing institutional credit. Trade efficiency pays for administration and remains in its bounded reward family.\n\nSource: https://westpreussisches-landesmuseum.de/en/exhibitions/featured-sections/featured-section-baltic-sea-trade-and-industry/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e44_title:0 "The Cost of Protection"
 owe_e44_desc:0 "The Cost of Protection\n\nHistorical root: War costs and taxation contributed to conflict with Prussian towns and nobles. The Confederation and its rebellion in 1454 reveal the limits of rule sustained only by military authority.\nWhy this mission (explicit alternate history): Continental protection should encounter the same fiscal constraint that threatened Prussia: promises cannot be funded by prestige alone.\nSource: Prussian crisis [S04]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Audit the financed network while solvent and with limited corruption. Certify accounts instead of purchasing a meaningless flag. Inflation relief and temporary accountability help fund the later oceanic economy.\n\nSource: https://academic.oup.com/book/32707/chapter-abstract/271969969\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e51_title:0 "Hospital Network"
 owe_e51_desc:0 "The Continental Hospitals\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (explicit alternate history): A continental hospital system makes the Order's charitable identity materially visible. Size also creates an expensive permanent obligation.\nSource: Order history [S01]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Expand the three Levantine hospitals into twelve operating hospitals overall. Maintain care at continental scale. Unrest relief supports a large state; appeals and scholarship remain optional complements.\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e52_title:0 "A Learned Order"
 owe_e52_desc:0 "A Learned Order\n\nHistorical root: Institutional literature included history, scripture and saints' lives. The literary tradition supports a learning theme; the mission schools and later universities are invented developments.\nWhy this mission (explicit alternate history): The learned brother becomes an administrator as well as a chronicler. Expanded colleges are imagined adaptations to a larger state.\nSource: Order institutions [S15]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Invest in universities or eight schools with mature administrative technology. Create a genuine higher-learning network. A temporary five-percent technology discount is substantial but bounded.\n\nSource: https://deutscher-orden.com/geschichte/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f23_title:0 "Congress of the Seas"
 owe_f23_desc:0 "A Congress of the Seas\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (explicit alternate history): The regional chapter becomes an imagined congress of maritime powers. Membership requires a treaty or a separately enforced political settlement.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\n\nCampaign progression: After the western footholds, establish African and Indian or East Indian representation. Convene the maritime congress with prestige, partners or scale, and peace. Relations support negotiation before F24 asks you to govern a protectorate.\n\nThe Order overseas: Represent the overseas houses in a congress of the Order. Diplomatic reach joins military and charitable obligations before protectorate rule. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f42_title:0 "The Chain of Safe Harbors"
 owe_f42_desc:0 "The Chain of Safe Harbors\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (explicit alternate history): Each safe harbor depends on local stores, staff and political permission. A broken treaty should visibly break the chain.\nSource: Commandery study [S06]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Extend the distant network to six directly owned port houses. Include African and eastern ports; an American subject with a dock can supply western support. Local harbor repair and trade benefits reward infrastructure without fighting colonial-nation formation. An American subject may represent the western chapter; you do not need to prevent colonial nation formation to keep a directly owned American house.\n\nThe Order overseas: Maintain the maritime chain of commanderies and subject chapter representation. Safe harbors are the supporting estates of the expedition, not a generic collection of overseas ports. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f43_title:0 "The Revenue of Protection"
 owe_f43_desc:0 "The Revenue of Protection\n\nHistorical root: Danzig, Thorn, Elbing and other Prussian towns participated in Baltic commercial networks. Urban privileges and merchants' interests made commerce a political relationship, not simply the Order's private income.\nWhy this mission (explicit alternate history): Protection dues have become a transoceanic commercial system. The mission tests whether commerce supports the navy without confiscation spirals.\nSource: Baltic trade [S07]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: After financing the first expedition, create recurring revenue. Retain 1,000 ducats and a forty-percent trade share without a deficit. A smaller reserve is intentional after investment; recurring income replaces the initial savings test.\n\nThe Order overseas: Fund three hospitals within commanderies alongside recurring trade revenue. The treasury now demonstrates that expansion can pay for the Order's charitable obligations. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://westpreussisches-landesmuseum.de/en/exhibitions/featured-sections/featured-section-baltic-sea-trade-and-industry/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f44_title:0 "Pay the Empire's Bills"
 owe_f44_desc:0 "An Empire That Pays Its Bills\n\nHistorical root: War costs and taxation contributed to conflict with Prussian towns and nobles. The Confederation and its rebellion in 1454 reveal the limits of rule sustained only by military authority.\nWhy this mission (explicit alternate history): The fiscal test returns at the largest scale. A hegemon that cannot meet payroll has not escaped the Order's original vulnerability.\nSource: Prussian crisis [S04]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Start the decade review after F31 and maintain ten consecutive solvent years. Finish with controlled corruption and fewer than two loans. Administrative savings reward sustained peace; this shares a project with the ending rather than demanding another decade.\n\nThe Order overseas: Keep three distant military houses and three hospitals operating through the accounting settlement. The Marshal and Spitler both receive support; profitable conquest alone cannot certify the accounts. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://academic.oup.com/book/32707/chapter-abstract/271969969\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g24_title:0 "The Volga Chain"
 owe_g24_desc:0 "The Volga Chain\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (explicit alternate history): Supply hubs turn a sweeping eastern ambition into a route that must actually function. Grants should follow the next reachable frontier only.\nSource: Commandery study [S06]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\nNext commission: Astrakhan, Lower Don. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use the Volga packet and directly establish three regional commanderies. Combine territorial reach with institutions on the river route. Astrakhan and Lower Don claims open the steppe stage.\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g26_title:0 "The Caucasian Gate"
 owe_g26_desc:0 "The Caucasian Gate\n\nHistorical root: Knights under Klaus von Redwitz served on Hungary's southern frontier. A network of nineteen Danube forts and three further sites faced severe financial and military difficulties; the mission ended unsuccessfully.\nWhy this mission (explicit alternate history): The Danube model of frontier service is projected onto Caucasian passes. Local agreements and difficult terrain determine the new mission's form.\nSource: Danube study [S05]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: Use the Caucasian packet and fortify the region. Hold four target provinces and two regional forts. Temporary defense concludes this optional eastern theater.\n\nSource: https://dspace.uni.lodz.pl/handle/11089/48252\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g33_title:0 "The Anatolian Campaign"
 owe_g33_desc:0 "The Anatolian Campaign\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (explicit alternate history): The coastal corridor supplies the eastern expedition. The conquest remains a fictional means of maintaining the new Mediterranean system.\nSource: Commandery study [S06]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Syria, Trans Jordan. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use the Anatolian commissions and recruit artillery. Hold five target provinces with ten artillery regiments. Syrian and Transjordanian claims open the Levantine hinterland.\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g54_title:0 "The Indian Compact"
 owe_g54_desc:0 "The Indian Compact\n\nHistorical root: The imperial charter associated with 1226 granted the Order rights in Culm and conquered Prussian territory, including courts, tolls and markets. It was a situated claim of authority, not a universal title.\nWhy this mission (explicit alternate history): The charter tradition supplies a model for negotiated privileges, not a title to India. In this timeline, established Indian Ocean stations create disputes that push the Order toward treaties with regional powers—or openly coercive expansion.\nSource: Rimini charter [S02]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Malacca. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use the Malabar packet and establish an owned port commandery. Bring fifteen heavy ships to support the Indian compact. One Malacca claim advances the trade route; F13 separately rewards fortifying the Indian base.\n\nThe Order overseas: Establish the Malabar commandery and a local school of the state faith. The Indian house earns the next Malacca commission; trade ambition is accompanied by religious service. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://sourcebooks.web.fordham.edu/source/12-13Cbalticcrusade.asp\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a22_title:0 "Petition the Emperor"
 owe_a22_desc:0 "Petition the Emperor\n\nHistorical root: The imperial charter associated with 1226 granted the Order rights in Culm and conquered Prussian territory, including courts, tolls and markets. It was a situated claim of authority, not a universal title.\nWhy this mission (historical problem; fictional resolution): Model the imperial charter as an argument to be presented and defended. Imperial patronage does not mean membership or a crown.\nSource: Rimini charter [S02]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Use diplomacy after establishing contact with Livonia. Obtain imperial recognition, HRE membership or three allies. Recognition assists diplomacy; the charter decision then certifies A23.\n\nSource: https://sourcebooks.web.fordham.edu/source/12-13Cbalticcrusade.asp\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a41_title:0 "Keep Danzig Open"
 owe_a41_desc:0 "Keep Danzig Open\n\nHistorical root: Danzig, Thorn, Elbing and other Prussian towns participated in Baltic commercial networks. Urban privileges and merchants' interests made commerce a political relationship, not simply the Order's private income.\nWhy this mission (historical problem; fictional resolution): Danzig's merchants need predictable port rights. A charter makes the commercial city useful without pretending its interests equal those of the brethren.\nSource: Baltic trade [S07]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Build Danzig's marketplace and repair wartime damage. Restore a functioning home port. Local trade power supports the grain, amber and customs branches.\n\nSource: https://westpreussisches-landesmuseum.de/en/exhibitions/featured-sections/featured-section-baltic-sea-trade-and-industry/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a43_title:0 "The Amber Accounts"
 owe_a43_desc:0 "The Amber Accounts\n\nHistorical root: The Order controlled amber collection and commerce through specialized officials, including the Amber Master at Lochstedt. Urban craft interests challenged the monopoly.\nWhy this mission (historical problem; fictional resolution): Use the Bernsteinmeister at Lochstedt as the named official in the event. Merchant licensing and a strict monopoly provoke different local interests.\nSource: Amber study [S13]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Make the amber policy choice after the port is restored. Choose how monopoly revenue and merchant interests are balanced. Capital production complements the chosen tradeoff and ends this commercial side branch.\n\nSource: https://amber.com.pl/en/amber/amber-in-the-teutonic-knights-state-in-prussia/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_a52_title:0 "Visit the Commanderies"
 owe_a52_desc:0 "Visit the Commanderies\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (historical problem; fictional resolution): Use visitation to test whether commanders regard houses as corporate property or private rewards. Patronage networks may obstruct the audit.\nSource: Mergentheim Museum [S12]. The source supports the historical background. The objective, reform and reward are proposed game design.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Use the audit and establish three permanent commanderies. Demonstrate a network that can actually be inspected. Lower state maintenance helps support later frontier law and court institutions.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b13_title:0 "The Gulf Approaches"
 owe_b13_desc:0 "The Gulf Approaches\n\nHistorical root: Danzig, Thorn, Elbing and other Prussian towns participated in Baltic commercial networks. Urban privileges and merchants' interests made commerce a political relationship, not simply the Order's private income.\nWhy this mission (institutional precedent; counterfactual development): Treat the Gulf of Riga as a commercial and naval system. Port access can achieve the objective without annexing every coastal city.\nSource: Baltic trade [S07]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Estonia Ingria. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use Curonian claims or preserve a friendly Livonian chapter. Combine that settlement with three directly owned Baltic ports. Estonian claims prepare the next naval frontier without requiring annexation of an allied chapter.\n\nSource: https://westpreussisches-landesmuseum.de/en/exhibitions/featured-sections/featured-section-baltic-sea-trade-and-industry/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b43_title:0 "Hull and Sail"
 owe_b43_desc:0 "Hull and Sail\n\nHistorical root: The Order took Gotland in 1398 during Baltic struggles involving piracy, trade and northern rulers. It transferred the island to Margaret in 1408. This was a specific intervention, not a Scandinavian empire.\nWhy this mission (institutional precedent; counterfactual development): A northern intervention needs transports, yards and crews. The shipbuilding reward applies to a funded fleet program rather than a magical navy.\nSource: Gotland history [S11]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Construct three docks and an eighteen-ship fleet. Create the industrial capacity to build ships. Reduced ship cost helps the fleet-finance mission and later convoy preparation.\n\nSource: https://gotland.com/article/medeltiden-pa-gotland/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_b51_title:0 "Recognize the Converts"
 owe_b51_desc:0 "The Converts Are Christians\n\nHistorical root: At Constance, Polish-Lithuanian representatives challenged Teutonic conduct. The controversy concerned Christianization and its credibility; it cannot be reduced to a permanently pagan Lithuania. Samogitia received a diocese in 1417.\nWhy this mission (institutional precedent; counterfactual development): Make the controversy at Constance visible: the question is authority over Christian communities, not whether Lithuania can be labeled pagan indefinitely.\nSource: Constance study [S03]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Take the recognition decision after settling the Polish border. Recognize a Christian Lithuania or existing Christian Samogitian communities. Improved relations reward restraint; Samogitian claims are renounced deliberately.\n\nSource: https://journals.phil.muni.cz/studia-historica-brunensia/article/view/27564\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c21_title:0 "Kings Who Ask for Knights"
 owe_c21_desc:0 "Kings Who Ask for Knights\n\nHistorical root: The Order's early activity included service in the Hungarian Burzenland under Hermann von Salza. That precedent supplies a frontier-service theme; the later protectorate hierarchy is invented.\nWhy this mission (institutional precedent; counterfactual development): Invitations from rulers are useful but conditional. The earlier Hungarian relationship warns that foreign service can become a sovereignty dispute.\nSource: Order institutions [S15]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: Use the Hungarian connection or a foothold in the Balkans. Combine regional presence with partners or sufficient territorial standing. Diplomatic support helps the frontier league; it does not grant foreign land.\n\nSource: https://deutscher-orden.com/geschichte/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c24_title:0 "A League of the Frontier"
 owe_c24_desc:0 "A League of the Frontier\n\nHistorical root: Knights under Klaus von Redwitz served on Hungary's southern frontier. A network of nineteen Danube forts and three further sites faced severe financial and military difficulties; the mission ended unsuccessfully.\nWhy this mission (institutional precedent; counterfactual development): The league proves that obligations survive the first campaign. Missing subsidies should damage reputation with all participating rulers.\nSource: Danube study [S05]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Fund the frontier mandate and assemble a league. An accepted protection compact reduces the allied-partner requirement. The benefit rewards a diplomatic frontier structure; alliance and territorial alternatives remain available.\n\nSource: https://dspace.uni.lodz.pl/handle/11089/48252\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c34_title:0 "Shield of the Danube"
 owe_c34_desc:0 "Shield of the Danube\n\nHistorical root: Knights under Klaus von Redwitz served on Hungary's southern frontier. A network of nineteen Danube forts and three further sites faced severe financial and military difficulties; the mission ended unsuccessfully.\nWhy this mission (institutional precedent; counterfactual development): The counterfactual hinge is a frontier institution that succeeds where the earlier mission failed. Success opens a Mediterranean ambition.\nSource: Danube study [S05]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Combine the protection charter with the secured crossings. Hold five Balkan provinces under stable, solvent rule. A regional legacy concludes the Danube theater; the Holy Land route uses the logistical branch.\n\nSource: https://dspace.uni.lodz.pl/handle/11089/48252\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c42_title:0 "The Foundries of Prussia"
 owe_c42_desc:0 "The Foundries of Prussia\n\nHistorical root: In 1309 the Grand Master established his seat at Malbork. The castle complex served a governing corporation with administrative, residential and religious functions.\nWhy this mission (institutional precedent; counterfactual development): Move the castle state's material administration into an early modern artillery program. The new foundries are an imagined industrial development.\nSource: Malbork Museum [S10]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Reach the relevant technology and build three manufactories. Invest in production beyond the initial supply reserve. Manufacturing support is a useful optional preparation for the later arsenal network.\n\nSource: https://zamek.malbork.pl/en/home/visit/history-of-the-castle/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c51_title:0 "Surgeons with the Army"
 owe_c51_desc:0 "Surgeons with the Army\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (institutional precedent; counterfactual development): Field care extends the hospital obligation to the army. Endowment costs ensure the charitable institution competes with military expenditure.\nSource: Order history [S01]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Extend three hospitals to four and retain money and manpower. Make relief capacity credible before relying on field surgeons. Manpower recovery supports subsequent campaigns and medical side branches.\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_c53_title:0 "Ransom and Relief"
 owe_c53_desc:0 "Ransom and Relief\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (institutional precedent; counterfactual development): Ransom and rebuilding make protection observable to civilians. Relief is paid for before it restores the Order's reputation.\nSource: Order history [S01]. The source supports the precedent. It does not document the successful expansion or new settlement proposed here.\n\nCampaign role: A major story decision with lasting consequences.\n\nCampaign progression: After actual provincial devastation, dispatch the relief decision. Restore damaged communities, then choose between ransom and family relief. A conditional wartime story; a peaceful campaign need not invent devastation to finish the main tree.\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_d42_title:0 "Acre's Granaries"
 owe_d42_desc:0 "Acre's Granaries\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (explicit alternate history): Grain reserves stabilize a recovered coastal state. The restored supply system should matter more than an immediate overseas tax windfall.\nSource: Commandery study [S06]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Repair Sidon, raise its production base and retain investment funds. Develop the restored port's productive hinterland. One base production is a concrete local reward, not a global economic multiplier.\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_d51_title:0 "Hospitals of the Pilgrims"
 owe_d51_desc:0 "Hospitals of the Pilgrims\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (explicit alternate history): Pilgrim hospitals give the restored eastern presence a purpose beyond territorial conquest. Endowments must remain solvent under military pressure.\nSource: Order history [S01]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Retain Acre's permanent hospital and fund two more in the Levant. Create a functioning pilgrim hospital network. Annual prestige supports continental legitimacy; regional care precedes the larger network.\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_d53_title:0 "The Schools of Jerusalem"
 owe_d53_desc:0 "The Schools of Jerusalem\n\nHistorical root: Institutional literature included history, scripture and saints' lives. The literary tradition supports a learning theme; the mission schools and later universities are invented developments.\nWhy this mission (explicit alternate history): A school in Jerusalem extends corporate learning into diplomacy and translation. It is an invented institution, not a rediscovered Teutonic university.\nSource: Order institutions [S15]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Endow Jerusalem's named college after its restoration. Recognize an operating school at the holy city. Permanent local institution spread is useful even when the school also served the custodial route.\n\nSource: https://deutscher-orden.com/geschichte/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_d54_title:0 "The Limits of the Sword"
 owe_d54_desc:0 "The Limits of the Sword\n\nHistorical root: At Constance, Polish-Lithuanian representatives challenged Teutonic conduct. The controversy concerned Christianization and its credibility; it cannot be reduced to a permanently pagan Lithuania. Samogitia received a diocese in 1417.\nWhy this mission (explicit alternate history): Require actual judgments about worship, property and jurisdiction. Neither triumph nor a sacred title solves the legitimacy problem by itself.\nSource: Constance study [S03]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Use the visitation's six houses and commission ecclesiastical review. Set limits on military authority within the established network. Temporary unrest relief concludes the institutional side branch.\n\nSource: https://journals.phil.muni.cz/studia-historica-brunensia/article/view/27564\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e42_title:0 "The Arsenal Network"
 owe_e42_desc:0 "The Arsenal Network\n\nHistorical root: In 1309 the Grand Master established his seat at Malbork. The castle complex served a governing corporation with administrative, residential and religious functions.\nWhy this mission (explicit alternate history): Replicate the headquarters' logistical functions across theaters, paying for each establishment. A network makes distance manageable without removing it.\nSource: Malbork Museum [S10]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Expand to eight manufactories, including two in each southern supply region. Create a geographically distributed arsenal system. Reduced artillery cost rewards substantial construction without boosting combat damage.\n\nSource: https://zamek.malbork.pl/en/home/visit/history-of-the-castle/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e53_title:0 "The Right to Petition"
 owe_e53_desc:0 "The Right to Petition\n\nHistorical root: The imperial charter associated with 1226 granted the Order rights in Culm and conquered Prussian territory, including courts, tolls and markets. It was a situated claim of authority, not a universal title.\nWhy this mission (explicit alternate history): Provincial appeals now test whether the protector's own servants obey its law. A judgment must restore something the commander wrongfully took.\nSource: Rimini charter [S02]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Hear provincial appeals through three real commanderies after E51. Pay for a local judicial intervention with institutional support. Administrative power and the decision's local settlements conclude the petition branch.\n\nSource: https://sourcebooks.web.fordham.edu/source/12-13Cbalticcrusade.asp\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_e54_title:0 "Beyond One Nation"
 owe_e54_desc:0 "A Service Larger Than a Nation\n\nHistorical root: General chapters addressed government, finance and religious affairs. Delegates from commanderies and bailiwicks represented an institution whose members could not all attend. This corporate machinery inspires the fictional later constitutions.\nWhy this mission (explicit alternate history): A corporate religious order already crosses dynastic borders; the proposed constitution now admits that service needs wider participation.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Carry the succession settlement into a culturally diverse state. Accept four cultures under the wider constitution. An extra accepted-culture slot supports a multinational service institution.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f41_title:0 "Finance the Ocean Roads"
 owe_f41_desc:0 "Finance the Ocean Roads\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (explicit alternate history): Separate expedition credit from hospital endowments. The invented oceanic treasury must meet recurring costs instead of rewarding expansion with endless cash.\nSource: Commandery study [S06]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Accumulate a 2,000-ducat reserve without loans before the Cape expedition. Show that an oceanic undertaking can be financed. Cheaper credit supports the expedition; the reserve is a readiness check, not an automatic expenditure.\n\nThe Order overseas: The Tressler draws support from three commanderies with churches or cathedrals. An oceanic treasury must rest on endowed religious estates as well as its financial reserve. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_f51_title:0 "Overseas Hospitals"
 owe_f51_desc:0 "Hospitals Under Foreign Skies\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (explicit alternate history): The hospital symbol now appears in unfamiliar ports. Local staff and endowments determine whether service is more than a foreign emblem.\nSource: Order history [S01]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Extend the continental hospitals after establishing distant charters. Maintain three distant hospitals, including Africa and India or the East Indies. Local relief rewards a new network; Acre and the old Levantine hospitals cannot complete this mission.\n\nThe Order overseas: Follow the Spitler's hospitals beyond the old Levantine network. Regional relief in Africa and the eastern seas remains useful under either overseas profession. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g11_title:0 "The Watch at Visby"
 owe_g11_desc:0 "The Watch at Visby\n\nHistorical root: The Order took Gotland in 1398 during Baltic struggles involving piracy, trade and northern rulers. It transferred the island to Margaret in 1408. This was a specific intervention, not a Scandinavian empire.\nWhy this mission (explicit alternate history): Name the earlier occupation of Gotland in the mission text. Reoccupation revives a real episode; subsequent Scandinavian hegemony does not.\nSource: Gotland history [S11]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\nNext commission: Denmark. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use B14's Gotland commission. Hold Visby directly or through a subject. Danish claims prepare the Sound settlement; this theater is optional.\n\nSource: https://gotland.com/article/medeltiden-pa-gotland/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g41_title:0 "The Imperial Lands"
 owe_g41_desc:0 "The Imperial Lands\n\nHistorical root: The Hohenlohe donation of 1219 established a durable German house. Mergentheim later became the Order's headquarters during the upheavals of the 1520s, demonstrating institutional survival beyond the Prussian state.\nWhy this mission (explicit alternate history): German houses provide institutional footholds, not a historical title to central Germany. The protector agenda deliberately expands their political meaning.\nSource: Mergentheim Museum [S12]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Palatinate, Lower Rhineland. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Follow the European agenda's Silesian and Franconian commission. Secure four imperial provinces in those areas. An authorized European theater grants Rhine and Palatinate claims; other agendas must authorize a second theater.\n\nSource: https://www.schloss-mergentheim.de/wissenswert-amuesant/meilensteine/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g45_title:0 "The Papal Seat"
 owe_g45_desc:0 "The Guardianship of Rome\n\nHistorical root: The imperial charter associated with 1226 granted the Order rights in Culm and conquered Prussian territory, including courts, tolls and markets. It was a situated claim of authority, not a universal title.\nWhy this mission (explicit alternate history): Treat papal guardianship as an unresolved question of independence. The coercive outcome contradicts the legitimacy claimed by the Order.\nSource: Rimini charter [S02]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Honor a papal concordat or control Rome. Resolve the Roman question without requiring the aggressive story option. Papal influence rewards the settlement; a peace-ratification decision follows.\n\nSource: https://sourcebooks.web.fordham.edu/source/12-13Cbalticcrusade.asp\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_g55_title:0 "The Eastern Straits"
 owe_g55_desc:0 "The Eastern Straits\n\nHistorical root: Danzig, Thorn, Elbing and other Prussian towns participated in Baltic commercial networks. Urban privileges and merchants' interests made commerce a political relationship, not simply the Order's private income.\nWhy this mission (explicit alternate history): The commercial bargain has become control of a distant chokepoint. A regional fleet and recurring expense make the new hegemony tangible.\nSource: Baltic trade [S07]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Fujian. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use G54's single Malacca commission. Hold the eastern straits with a sixty-ship navy. A limited Fujian coastal claim prepares the Pacific settlement.\n\nThe Order overseas: Provide Malacca with both a commandery and funded hospital. Only an established service station earns the next Fujian claim. These worldwide deployments are fictional extensions of historical offices, religious service and frontier military obligations. Source: https://deutscher-orden.com/geschichte/\n\nSource: https://westpreussisches-landesmuseum.de/en/exhibitions/featured-sections/featured-section-baltic-sea-trade-and-industry/\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
