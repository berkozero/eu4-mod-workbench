 owe_build_hospital_title:0 "Fund Hospital Care"
 owe_build_hospital_desc:0 "Choose a region, then endow one eligible province there for 60 ducats and 10 ADM. The final choice names the selected province in its effect tooltip. No resources are spent if you cancel. Hospital care is funded for ten years; schools and commanderies are permanent local institutions. These foundations count toward the mission requirements for that region."
 owe_build_commandery_title:0 "Establish a Commandery"
 owe_build_commandery_desc:0 "Choose a region, then endow one eligible province there for 40 ducats and 10 ADM. The final choice names the selected province in its effect tooltip. No resources are spent if you cancel. Hospital care is funded for ten years; schools and commanderies are permanent local institutions. These foundations count toward the mission requirements for that region."
 owe_build_school_title:0 "Endow a Pastoral School"
 owe_build_school_desc:0 "Choose a region, then endow one eligible province there for 50 ducats and 10 ADM. The final choice names the selected province in its effect tooltip. No resources are spent if you cancel. Hospital care is funded for ten years; schools and commanderies are permanent local institutions. These foundations count toward the mission requirements for that region."
