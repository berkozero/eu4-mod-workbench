 owe_d21_title:0 "The Hospitallers"
 owe_d21_desc:0 "Speak with the Hospitallers\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (explicit alternate history): The Hospitallers remain a separate order with separate interests. Cooperation does not quietly merge their possessions into the Teutonic state.\nSource: Order history [S01]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Contact the Knights after reaching the Aegean. Cooperate with an existing order or preserve its institutional purpose after extinction. Naval cooperation rewards this optional diplomatic branch.\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_event_21_t:0 "Charter an Overseas House"
 owe_event_21_d:0 "Overseas houses extrapolate the Order's European estate and hospital network. This version endows an owned overseas port; it grants no free colonies."
 owe_event_21_0:0 "Found the overseas house."
 owe_d22_title:0 "Passage of the Straits"
 owe_d22_desc:0 "Passage Through the Straits\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (explicit alternate history): A treaty across the straits is only one possible supply solution. The alternate Mediterranean route prevents the campaign from requiring Constantinople prematurely.\nSource: Commandery study [S06]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Fortify the existing Aegean foothold and add galleys and an admiral, or hold Constantinople. Secure passage using a developed base instead of demanding a second unclaimed island. Ship repair supports further maritime operations.\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_event_22_t:0 "Convene the World Chapter"
 owe_event_22_d:0 "A worldwide chapter is fictional, extending the historical system of representatives from regional houses."
 owe_event_22_0:0 "Seat the regional representatives."
 owe_d23_title:0 "The Levantine Settlement"
 owe_d23_desc:0 "The Levantine Settlement\n\nHistorical root: Montfort was a major Teutonic fortress in the Latin East. Baibars captured and destroyed it in 1271. Rebuilding its estate after a new return to Acre is a counterfactual restoration.\nWhy this mission (explicit alternate history): A rebuilt estate network needs settlement terms for inhabitants and neighboring powers. Medieval possession is inspiration for a claim, not proof of timeless entitlement.\nSource: Montfort report [S14]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign.\n\nCampaign progression: Extend the Acre restoration into three Levantine commanderies. Create a local administrative network beyond the conquered holy cities. Local unrest relief supports the service-model settlement at D24.\n\nSource: https://hadashot.iaa.org.il/Report_Detail.aspx?id=26169&print=nopic\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_event_23_t:0 "Proclaim a Frontier Mandate"
 owe_event_23_d:0 "A late-game service commission continues after the mission tree. It grants one ten-year defensive contract, not worldwide claims."
 owe_event_23_0:0 "Fund the next decade."
 owe_d24_title:0 "The Pilgrim Confederation"
 owe_d24_desc:0 "The Pilgrim Confederation\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (explicit alternate history): Interlinked sanctuaries extend the founding hospital into a multinational institution. Protection duties follow the money.\nSource: Order history [S01]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: An optional branch; it need not be completed to finish the campaign. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: Follow the hospital choice made at Acre. Open wards require three regional hospitals; the brethren's model requires three regional forts. Tolerance rewards a completed service structure; neither choice silently requires the opposite policy.\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_event_24_t:0 "Claim Universal Temporal Dominion"
 owe_event_24_d:0 "This epilogue is explicitly fictional. Universal obedience is not represented as consent. The historical Order never possessed a worldwide conquest program."
 owe_event_24_0:0 "Record the extraordinary outcome."
 owe_d25_title:0 "Choose the Next Charge"
 owe_d25_desc:0 "Jerusalem fulfills the old geographical ambition, but this fictional Order refuses to stop. Choose a primary agenda grounded in a different strand of its past: Levantine service, eastern frontier warfare, or European corporate politics."
 owe_event_25_t:0 "Choose the Next Charge"
 owe_event_25_d:0 "Jerusalem fulfills the old geographical ambition, but this fictional Order refuses to stop. Choose a primary agenda grounded in a different strand of its past: Levantine service, eastern frontier warfare, or European corporate politics."
