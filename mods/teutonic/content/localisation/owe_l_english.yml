 owe_d11_title:0 "An Aegean Station"
 owe_d11_desc:0 "An Aegean Station\n\nHistorical root: The Order supported its eastern activity through geographically scattered houses, donations, agricultural resources and revenue. Its commanderies were economic and administrative institutions as well as religious ones.\nWhy this mission (explicit alternate history): A Mediterranean station translates the commandery network into naval logistics. It must have a host, stores and a route home.\nSource: Commandery study [S06]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter.\nNext commission: 1855. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use C44's single-island claim and complete the convoy branch. Directly hold one Aegean port with the prepared transport and escort fleet. The Sidon/Acre permanent claim establishes the next concrete target.\n\nSource: https://www.cambridge.org/core/books/teutonic-knights-in-the-holy-land-11901291/ECDDACCD301C5B4E4FE1F1F5D05F1E6E/listing\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_event_11_t:0 "Appoint a Landmeister"
 owe_event_11_d:0 "Regional masters administered the historical Order. Here delegation creates three local houses with a small tax concession."
 owe_event_11_0:0 "Fund three regional offices."
 owe_d12_title:0 "The Road to Acre"
 owe_d12_desc:0 "The Road to Acre\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (explicit alternate history): Return to the place of foundation through sanctuary agreement or conquest. The two methods produce different legitimacy and local resistance.\nSource: Order history [S01]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: Part of the route to the final chapter. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\nNext commission: Palestine. Claims prepare a later objective; they grant no land or cores.\n\nCampaign progression: Use the Sidon commission and register the Mediterranean station. Directly acquire Sidon, because the next mission restores its hospital. Palestinian claims prepare Jerusalem; funding the mother hospital comes first.\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_event_12_t:0 "Launch a Relief Mission"
 owe_event_12_d:0 "Hospital service is the historical root. This one-time relief fund repairs war damage without farmable national rewards."
 owe_event_12_0:0 "Send five relief detachments."
 owe_d13_title:0 "The House Restored"
 owe_d13_desc:0 "The House Restored\n\nHistorical root: Montfort was a major Teutonic fortress in the Latin East. Baibars captured and destroyed it in 1271. Rebuilding its estate after a new return to Acre is a counterfactual restoration.\nWhy this mission (explicit alternate history): Tie the restored Acre house to an optional Montfort estate project. Montfort is a provincial site, not an invented new EU4 province.\nSource: Montfort report [S14]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: A major story decision with lasting consequences.\n\nCampaign progression: Endow the permanent hospital at owned Sidon through its named decision. Choose open wards or a hospital focused on the brethren. Jerusalem follows; the selected service model changes D24's later requirements.\n\nSource: https://hadashot.iaa.org.il/Report_Detail.aspx?id=26169&print=nopic\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_event_13_t:0 "Charter a Mediterranean Station"
 owe_event_13_d:0 "Endow an owned Mediterranean port. This playable version requires ownership; a mere alliance does not grant a foreign base."
 owe_event_13_0:0 "Provision the Mediterranean station."
 owe_d14_title:0 "Guardians of Jerusalem"
 owe_d14_desc:0 "Guardians of Jerusalem\n\nHistorical root: A hospital established at the siege of Acre became the institutional origin of the Order. Care for the sick and its later military vocation belonged to the same religious corporation.\nWhy this mission (explicit alternate history): The Order's name reaches back to Jerusalem, but its foundation was at Acre. Guardianship is the story's midpoint, not its historical destiny fulfilled automatically.\nSource: Order history [S01]. The source supports the historical inspiration only. This later objective and the political program behind it are invented.\n\nCampaign role: A major story decision with lasting consequences. Requirements have been revised for the branching campaign; the checklist below replaces the original design proposal.\n\nCampaign progression: Use the Palestinian commission and retain both Acre and Jerusalem at peace. Choose a custodial arrangement or direct military administration. This is a major turning point; legitimacy, regional institutions and further agendas continue afterward.\n\nSource: https://www.deutscher-orden.de/wer-wir-sind/erbe-und-auftrag\n\nThis is an alternative-history campaign. The source supports the historical root, not a documented plan for these conquests. The checklist below gives the implemented game requirements."
 owe_event_14_t:0 "Restore the Hospital at Acre"
 owe_event_14_d:0 "The Order emerged from a hospital at the siege of Acre in 1190. Acre is represented within EU4's Sidon province (1855), not as a new map province. The restoration is a counterfactual."
 owe_event_14_0:0 "Endow the mother hospital permanently."
 owe_d16_title:0 "Reform the Rule"
 owe_d16_desc:0 "The secularization of Prussia in 1525 shows the historical institutional danger. An enduring reformed Order is the invented alternative."
 owe_event_16_t:0 "Reform the Rule"
 owe_event_16_d:0 "The secularization of Prussia in 1525 shows the historical institutional danger. An enduring reformed Order is the invented alternative."
 owe_event_16_0:0 "Renew the elective rule."
