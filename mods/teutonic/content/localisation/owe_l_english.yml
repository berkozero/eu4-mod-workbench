 owe_event_25_1:0 "The March Without End: the east."
 owe_event_25_2:0 "The Crownless Empire: Europe."
 owe_d26_title:0 "Restore Montfort / Starkenberg"
 owe_d26_desc:0 "Montfort was an important Teutonic castle in Galilee, lost to Baybars in 1271. Its reconstruction is represented within Sidon (1855). No fort building is created for free."
 owe_event_26_t:0 "Restore Montfort / Starkenberg"
 owe_event_26_d:0 "Montfort was an important Teutonic castle in Galilee, lost to Baybars in 1271. Its reconstruction is represented within Sidon (1855). No fort building is created for free."
 owe_event_26_0:0 "Restore the estate."
 owe_d27_title:0 "Territorial Commissions: How They Work"
 owe_d27_desc:0 "Frontier missions automatically grant permanent claims on their next target. If every target was allied, owned or undiscovered, a free Issue Pending Claims decision becomes available once an eligible target exists. Recognition renounces Samogitia only. Overseas commissions cover one discovered, colonized coastal province."
 owe_event_27_t:0 "Territorial Commissions"
 owe_event_27_d:0 "Claims are issued automatically with mission completion. Look for Issue Pending Claims only when the original packet had no eligible target. Each packet is issued once. These are permanent claims, not cores or land transfers."
 owe_event_27_0:0 "Understood."
 owe_d28_title:0 "Authorize a European Theater"
 owe_d28_desc:0 "For an eastern or Levantine primary agenda: spend 150 ducats and 75 DIP to authorize European claims. Already completed E11/E12 issue their eligible Silesian/Franconian claims immediately; unfinished missions issue them when completed. The European primary agenda already has this authorization."
 owe_event_28_t:0 "Open a Second Theater"
 owe_event_28_d:0 "A new theater extends, rather than resets, the Order's campaign. The same completed missions and constitution remain in force."
 owe_event_28_0:0 "Open the European commission."
 owe_project_charters_title:0 "Assemble the Charter Case"
 owe_project_charters_desc:0 "A diplomatic adviser assembles the legal case. Unlocks A23 and the northern corridor claims. Cost: 50 ducats and 25 ADM. Historical root: chapters, visitations and regional estate administration. This institutional continuation is fictional. Source: https://deutscher-orden.com/geschichte/"
 owe_project_review_title:0 "Inspect the Charitable Houses"
 owe_project_review_desc:0 "Requires an operating hospital. Certifies the service missions A54, C54 and D54. Cost: 40 ducats and 20 ADM. Historical root: chapters, visitations and regional estate administration. This institutional continuation is fictional. Source: https://deutscher-orden.com/geschichte/"
 owe_project_court_title:0 "Establish the Common Court"
 owe_project_court_desc:0 "Three commanderies receive ten-year circuit courts (-0.5 local unrest); unlocks B33 and later judicial missions. Cost: 100 ducats and 40 ADM. Historical root: chapters, visitations and regional estate administration. This institutional continuation is fictional. Source: https://deutscher-orden.com/geschichte/"
 owe_project_visitation_title:0 "Inspect the Two Provinces of the Order"
 owe_project_visitation_desc:0 "Requires three European and three Levantine houses before they can be inspected. Certifies D31; the succession and rule debates follow. Cost: 100 ducats and 40 ADM. Historical root: chapters, visitations and regional estate administration. This institutional continuation is fictional. Source: https://deutscher-orden.com/geschichte/"
 owe_project_credit_title:0 "Underwrite Three Commanderies"
 owe_project_credit_desc:0 "Three houses receive ten years of -10% local construction cost. Their building projects prepare the continental economy; certification opens E41. Cost: 150 ducats and 25 ADM. Historical root: chapters, visitations and regional estate administration. This institutional continuation is fictional. Source: https://deutscher-orden.com/geschichte/"
 owe_project_network_accounts_title:0 "Certify the Continental Accounts"
 owe_project_network_accounts_desc:0 "Certifies low debt and clean accounts, reduces inflation/corruption by 0.5, and enables E44. Cost: 100 ducats and 25 ADM. Historical root: chapters, visitations and regional estate administration. This institutional continuation is fictional. Source: https://deutscher-orden.com/geschichte/"
 owe_project_appeals_title:0 "Hear the Provincial Appeals"
 owe_project_appeals_desc:0 "Three provincial houses receive enforceable appeal settlements (-1 local unrest for ten years). Enables E53. Cost: 90 ducats and 30 ADM. Historical root: chapters, visitations and regional estate administration. This institutional continuation is fictional. Source: https://deutscher-orden.com/geschichte/"
 owe_project_succession2_title:0 "Record Two Orderly Successions"
 owe_project_succession2_desc:0 "Only available after two actual ruler changes since A34. This constitutional certification enables F33; it does not manufacture a ruler change. Cost: 0 ducats and 50 ADM. Historical root: chapters, visitations and regional estate administration. This institutional continuation is fictional. Source: https://deutscher-orden.com/geschichte/"
 owe_project_faith_title:0 "Set the Overseas Religious Rule"
 owe_project_faith_desc:0 "After two overseas houses exist, choose whether to protect local rites or fund conversion. Each policy has a permanent tradeoff, records the religious rule and prepares F52. The choice is an invented extension of the Order's institutional survival through confessional change. The two houses must now be in Africa, India, the East Indies, the Americas or Oceania; the old Levantine houses do not satisfy the overseas stage."
 owe_project_membership_title:0 "Admit Provincial Brothers"
 owe_project_membership_desc:0 "Requires two accepted cultures and two overseas houses. Opens provincial recruitment (-5% adviser cost for ten years) and enables F53. Cost: 0 ducats and 25 ADM. Historical root: chapters, visitations and regional estate administration. This institutional continuation is fictional. Source: https://deutscher-orden.com/geschichte/ The two houses must now be in Africa, India, the East Indies, the Americas or Oceania; the old Levantine houses do not satisfy the overseas stage."
 owe_project_europe_peace_title:0 "Ratify the European Peace"
 owe_project_europe_peace_desc:0 "With peace and stability restored, a fifteen-year settlement reduces subject liberty desire by 5. Certifies G46. Cost: 0 ducats and 50 ADM. Historical root: chapters, visitations and regional estate administration. This institutional continuation is fictional. Source: https://deutscher-orden.com/geschichte/"
 owe_project_pacific_accounts_title:0 "Audit the Pacific Station"
 owe_project_pacific_accounts_desc:0 "Requires an actual Fujian port and commandery, supported by twenty heavy ships. Gives the station +15% trade power for fifteen years and enables G56. Cost: 100 ducats and 25 ADM. Historical root: chapters, visitations and regional estate administration. This institutional continuation is fictional. Source: https://deutscher-orden.com/geschichte/"
 owe_begin_decade_title:0 "Begin the Ten-Year Accounting Period"
 owe_begin_decade_desc:0 "After the World Chapter, keep peace, fewer than two loans, and a positive balance for ten consecutive annual reviews. Failure resets the counter."
 owe_event_1000_t:0 "The Order Without End"
 owe_event_1000_d:0 ""
 owe_event_1000_0:0 "Record the foundation."
 owe_event_100_t:0 "A Rule Renewed"
 owe_event_100_d:0 "The Prussian foundation is secure. The chapter can now debate a wider Baltic role."
 owe_event_100_0:0 "The chapter records its decision."
 owe_event_101_t:0 "The Baltic Protectorate"
 owe_event_101_d:0 "Baltic administration and relief now support a renewed frontier commitment."
 owe_event_101_0:0 "The chapter records its decision."
 owe_event_102_t:0 "The Shield of the Danube"
 owe_event_102_d:0 "The Danube branch recalls a real but poorly funded Teutonic deployment. Our lasting league is a counterfactual."
 owe_event_102_0:0 "The chapter records its decision."
 owe_event_103_t:0 "The Fulfilled Vow"
 owe_event_103_d:0 "Jerusalem is a turning point, not the ending. Choose the Next Charge in Decisions to select the Levant, eastern marches, or European politics. None was a historical plan for universal conquest."
 owe_event_103_0:0 "The chapter records its decision."
 owe_event_104_t:0 "The Universal Protectorate"
 owe_event_104_d:0 "Continental institutions now support overseas expeditions. The commandery network becomes the fictional bridge to a global Order."
 owe_event_104_0:0 "The chapter records its decision."
 owe_event_105_t:0 "The Order Without End"
 owe_event_105_d:0 "The long campaign is complete. Further frontier mandates and an optional world-conquest epilogue remain in Decisions. This outcome is explicitly fictional."
 owe_event_105_0:0 "The chapter records its decision."
