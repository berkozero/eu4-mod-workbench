 owe_event_610_t:0 "Whose Rites May the Houses Protect?"
 owe_event_610_d:0 "Provincial brothers ask whether service requires conversion. The Order historically survived confessional division; extending its rule across a global empire is fictional. Choose tolerance at the expense of conversion speed, or conversion at the expense of tolerance. This certifies the policy required by F52. Source: https://deutscher-orden.com/geschichte/"
 owe_event_610_0:0 "Protect local rites."
 owe_event_610_1:0 "Fund a missionary rule."
 owe_confirm_prussian_settlement_title:0 "Confirm the Prussian Settlement"
 owe_confirm_prussian_settlement_desc:0 "For campaigns that completed A33 before version 0.5: meet the same Prussian resolution requirements to record the settlement in the base game and end its Confederation disaster. No mission is reset and no reward is paid twice."
 owe_oceanic_marshal:0 "The Marshal's Overseas Rule"
 owe_oceanic_spitler:0 "The Spitler's Overseas Rule"
 owe_brethren_reserves:0 "Reserves of the Brethren"
 owe_chaplain_college:0 "College of Priest-Brothers"
 owe_oceanic_rule_title:0 "Profess the Overseas Rule"
 owe_oceanic_rule_desc:0 "After F11, two distant port houses must decide what service means. The Marshal requires two fortified houses and a general; the Spitler requires three hospitals and two schools of the state faith. The final choice costs 100 ducats and 25 ADM. F21 needs this profession; F24 and the ending test the resulting institution. This worldwide rule is fictional. Source: https://deutscher-orden.com/geschichte/"
 owe_event_620_t:0 "The Sword and the Hospital"
 owe_event_620_d:0 "The Marshal demands defended commanderies and trained brethren; the Spitler and priest-brothers demand hospitals, schools and religious service. These offices belonged to the historical Order. Their competition over a worldwide network is invented. Choose a lasting institutional obligation; its national modifier lasts twenty years. Source: https://deutscher-orden.com/geschichte/"
 owe_event_620_0:0 "Profess the Marshal's Rule."
 owe_event_620_1:0 "Profess the Spitler's Rule."
 owe_event_620_2:0 "Let the chapter deliberate longer."
 owe_frontier_service_title:0 "Begin the Brethren's Frontier Service"
 owe_frontier_service_desc:0 "After F11, station brethren in two directly owned distant fortified commanderies. A general and 40% manpower reserves begin their service. F13 recognizes them after three years. Historical root: the later Order required a period of frontier military service before appointment to office; applying it to oceanic fortresses is fictional. Source: https://deutscher-orden.com/geschichte/"
 owe_choose_title_title:0 "Choose the Order's Public Title"
 owe_choose_title_desc:0 "After D34, adopt an optional public title. Continental and final honors unlock after E34 and F34. Only the name and adjective change; your country tag, ideas, government and missions stay intact. Free and reversible. Later titles are fictional honors inspired by the Order. Source: https://deutscher-orden.com/geschichte/"
 OWE_MARIAN_ORDER:0 "Order of Saint Mary"
 OWE_MARIAN_ORDER_ADJ:0 "Marian"
 OWE_ORDENSSTAAT:0 "Teutonic Ordensstaat"
