 owe_event_301_t:0 "The Commander on the Litter"
 owe_event_301_d:0 "A provincial commander returns from a border action with a fevered wound. The surgeons need an escort and money. The company argues that those men belong on the frontier. Rescue him and a recovered veteran will return after ninety days; leave him and the army records his death.\n\nHistorical root: The defeat of 1410 decimated the leadership. Hospital care and military service coexisted within the Order.\nThis episode, its characters and choices are fictional continuations of that history. Source: https://www.deutscherorden.de/site/schwestern/geschichtlicherhintergrun"
 owe_event_301_0:0 "Send surgeons and an escort."
 owe_event_301_1:0 "Hold the frontier. We cannot spare the escort."
 owe_event_321_t:0 "A Place at the Muster"
 owe_event_321_d:0 "The fictional wounded commander has recovered. He is capable, not a miraculous conqueror. His rescued escort returns to the manpower pool. Historical root: the Order combined military service with hospital care. Source: https://www.deutscherorden.de/site/schwestern/geschichtlicherhintergrun"
 owe_event_321_0:0 "Return him to service."
 owe_event_302_t:0 "The Spokesman Before the Chapter"
 owe_event_302_d:0 "A spokesman of the Prussian towns has challenged the Order's extraordinary levy. The treasurer demands an example. A public hearing may secure the towns, but only by surrendering revenue. A conviction preserves the levy while making Danzig harder to pacify.\n\nHistorical root: The Prussian estates and towns resisted the Order; their conflict culminated in the Thirteen Years' War.\nThis episode, its characters and choices are fictional continuations of that history. Source: https://zamek.malbork.pl/en/exhibition/wystawa-stala-9/"
 owe_event_302_0:0 "Release him and confirm the town charter."
 owe_event_302_1:0 "Convict him; collect the disputed levy."
 owe_event_303_t:0 "Where Shall the Border End?"
 owe_event_303_d:0 "A settlement with Poland creates a choice: accept a recognized southern border and seek a Ruthenian corridor, or press the Order's corporate claims farther into Greater Poland. Either policy can support the later eastern route. Conquest is an invented escalation, not a surviving medieval universal program.\n\nHistorical root: The Order fought over territorial and jurisdictional rights in Prussia, while Polish and Lithuanian rulers challenged those claims.\nThis episode, its characters and choices are fictional continuations of that history. Source: https://zamek.malbork.pl/en/exhibition/wystawa-stala-9/"
 owe_event_303_0:0 "Accept the border and the cost of reconciliation."
 owe_event_303_1:0 "Extend the territorial case into Greater Poland."
 owe_event_304_t:0 "The Keys of Riga"
 owe_event_304_d:0 "Riga's council will not confuse protection with the extinction of its liberties. If Riga is ours, choose its charter. If it is an ally, our treaty can recognize its freedom but cannot impose our tax collector.\n\nHistorical root: The Livonian Order, bishops and autonomous towns exercised competing forms of authority.\nThis episode, its characters and choices are fictional continuations of that history. Source: https://www.rigamuz.lv/rvkm/en/ekspoz_eng/history-of-riga-riga-as-part-of-livonia-13th-16th-cent/"
 owe_event_304_0:0 "Confirm the council and its commercial courts."
 owe_event_304_1:0 "Place the city under a commandery."
 owe_event_305_t:0 "The Empty Pay Chest"
 owe_event_305_d:0 "The new Danube fortresses have walls but their garrisons are unpaid. A provincial master asks for emergency funding. Pay now to retain the men, or recall them and rebuild reserves for two years before the next crossing can be certified.\n\nHistorical root: Klaus von Redwitz's Teutonic deployment on Sigismund's frontier in 1429-1435 suffered from inadequate financial arrangements.\nThis episode, its characters and choices are fictional continuations of that history. Source: https://dspace.uni.lodz.pl/handle/11089/48252"
 owe_event_305_0:0 "Find 150 ducats; keep the garrison."
 owe_event_305_1:0 "Recall the unpaid companies."
 owe_event_306_t:0 "Names on the Ransom List"
 owe_event_306_d:0 "There is enough money for one convoy: a captured officer with his men, or families displaced from the frontier. Rescuing soldiers restores a little manpower. Bringing the families home repairs devastated settlements. If the treasury is empty, record the failure instead of conjuring a reward.\n\nHistorical root: Care of the sick and needy was foundational to the Order. This particular prisoner exchange is invented.\nThis episode, its characters and choices are fictional continuations of that history. Source: https://www.deutscherorden.de/site/schwestern/geschichtlicherhintergrun"
 owe_event_306_0:0 "Ransom the officer and his men."
 owe_event_306_1:0 "Bring the displaced families home."
 owe_event_306_2:0 "We have failed these petitioners."
 owe_event_307_t:0 "Who May Enter the Hospital?"
 owe_event_307_d:0 "The restored Acre hospital is filling with wounded strangers. Open every ward and accept the expense of relief, or reserve the endowed beds for the brethren and build a defended network. The later Pilgrim Confederation will ask for three Levantine hospitals under an open charter, or three forts under the brethren's charter.\n\nHistorical root: A German field hospital during the siege of Acre in 1190 preceded the military order.\nThis episode, its characters and choices are fictional continuations of that history. Source: https://www.deutscherorden.de/site/schwestern/geschichtlicherhintergrun"
 owe_event_307_0:0 "The wards are open to those who need them."
 owe_event_307_1:0 "The military endowment serves the brethren first."
 owe_event_308_t:0 "The Keys of Jerusalem"
 owe_event_308_d:0 "The city is taken. Its inhabitants now ask who will judge disputes and collect rents. Entrust local custodians with civic life and prove the new settlement through schools, or govern from a fortified commandery and restore calm before declaring the vow fulfilled.\n\nHistorical root: The Order originated in the Holy Land and later developed territorial government in Prussia. A Teutonic reconquest and this settlement are counterfactual.\nThis episode, its characters and choices are fictional continuations of that history. Source: https://www.deutscherorden.de/site/schwestern/geschichtlicherhintergrun"
 owe_event_308_0:0 "Entrust the city to local custodians."
 owe_event_308_1:0 "The commander will govern directly."
 owe_event_309_t:0 "A Master, or a Prince?"
 owe_event_309_d:0 "A Landmeister asks to hold his estates for life and pass their revenues to his household. Refusing him preserves an elective corporation, but requires political capital. A personal tenure purchases peace by conceding income; it does not turn the state into a monarchy or give away provinces.\n\nHistorical root: Albrecht secularized Prussia in 1525, while the remaining Order continued under new leadership outside Prussia.\nThis episode, its characters and choices are fictional continuations of that history. Source: https://deutscher-orden.com/geschichte/"
 owe_event_309_0:0 "Reaffirm election and the common estate."
 owe_event_309_1:0 "Concede life tenures, without hereditary sovereignty."
 owe_event_310_t:0 "The Chapters Refuse the Levy"
 owe_event_310_d:0 "Provincial chapters say that distant expeditions have become a tax without a voice. Negotiate representation and finance it now, or depose their Landmeisters and face a recovery in men and authority. The constitutional mission will require ten functioning houses after negotiation, or a recovered army after deposition.\n\nHistorical root: The historical Order governed through regional offices and chapters. Continental resistance to a universal protectorate is an invented extension of that structure.\nThis episode, its characters and choices are fictional continuations of that history. Source: https://deutscher-orden.com/geschichte/"
 owe_event_310_0:0 "Seat the provincial delegates."
 owe_event_310_1:0 "Depose the refusing Landmeisters."
 owe_event_311_t:0 "The Protector Under Accusation"
 owe_event_311_d:0 "A provincial petition names commanders who seized supplies from protected communities. An open inquiry will expose accounts and cost prestige. Emergency indemnity protects the officers but leaves five years of public distrust before a final review can succeed.\n\nHistorical root: Visitations and corporate oversight were real institutions; a global Order and this scandal are fictional extrapolations.\nThis episode, its characters and choices are fictional continuations of that history. Source: https://deutscher-orden.com/geschichte/"
 owe_event_311_0:0 "Open the accounts and hear the witnesses."
 owe_event_311_1:0 "Indemnify the officers under emergency powers."
 owe_event_312_t:0 "The Last Petition"
 owe_event_312_d:0 "The commission has proved that a senior officer exceeded his mandate. His relatives demand a pardon. Restitution costs money and restrains the office; pardoning him keeps the commanders loyal at the price of the institution's reputation. Neither outcome claims that conquered peoples consented to the empire.\n\nHistorical root: The Order's rule and visitations provide the institutional root for accountability; the officer and global tribunal are invented.\nThis episode, its characters and choices are fictional continuations of that history. Source: https://deutscher-orden.com/geschichte/"
 owe_event_312_0:0 "Remove him and compensate the petitioners."
 owe_event_312_1:0 "Pardon him, and bear the public judgment."
 owe_event_313_t:0 "What Must Outlive the Master?"
 owe_event_313_d:0 "The chapter has survived wars, successions and a decade of audited solvency. The final charter can bind its houses to a hospital federation, or openly claim temporal protection over its territories. Both leave costs and unfinished obligations; neither grants universal obedience or universal claims.\n\nHistorical root: The historical Order endured after losing its Prussian state and continued religious and charitable work. A worldwide sovereign institution is a counterfactual.\nThis episode, its characters and choices are fictional continuations of that history. Source: https://deutscher-orden.com/geschichte/"
 owe_event_313_0:0 "Bind the houses to an enduring hospital federation."
 owe_event_313_1:0 "Ratify the temporal protectorate."
 owe_event_314_t:0 "A Summons to Rome"
 owe_event_314_d:0 "The chapter has acquired a foothold in Iberia and now proposes that Rome submit its temporal disputes to our court. Preserve the distinction between the Order and the papacy, or publish claims to Lazio before marching there. A territorial claim begins a confrontation; it does not require an already captured pope.\n\nHistorical root: Papal recognition was important to the historical Order. Turning corporate privilege into jurisdiction over Rome is an explicitly invented reversal.\nThis episode, its characters and choices are fictional continuations of that history. Source: https://deutscher-orden.com/geschichte/"
 owe_event_314_0:0 "Recognize the papacy as an independent partner."
 owe_event_314_1:0 "Assert a temporal jurisdiction over Lazio."
 owe_reconcile_stories_title:0 "Convene the Unheard Chapters (v0.3 saves)"
 owe_reconcile_stories_desc:0 "For a campaign begun before v0.3: hear the new story dilemmas for already completed missions, once each. Existing mission completion and province ownership are preserved. This can open several events. New campaigns do not need this decision."
